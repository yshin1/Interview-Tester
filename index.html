<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Langdy Hub</title>
<link rel="manifest" id="webManifestLink" href="manifest.json">
<script>
  // Must run this early (before the page is fully parsed) — Chrome decides
  // installability/start_url from whichever manifest is linked at that
  // point, and a manifest swapped in later (e.g. on DOMContentLoaded) can
  // be too late. A normal <link href="manifest.json"> alone would mean
  // installing from ANY page — including ?admin — always launches back at
  // the plain base URL, since that's what start_url in manifest.json says,
  // regardless of which page you were on when you tapped "Install".
  if(window.location.search.includes('admin')){
    document.getElementById('webManifestLink').href = 'manifest-admin.json';
  }
</script>
<meta name="theme-color" content="#16233F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Langdy">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-functions-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
  :root{
    --navy:#16233F;
    --navy-2:#1E2E52;
    --paper:#F1F2F4;
    --card:#FFFFFF;
    --ink:#181B22;
    --slate:#5C6470;
    --slate-light:#8A93A3;
    --line:#DADFE6;
    --gold:#C79A3B;
    --gold-dark:#A87F2C;
    --gold-bg:#FBF3E1;
    --brand-orange:#FF6A2A;
    --success:#2F7D5E;
    --success-bg:#E7F4EE;
    --danger:#B3432B;
    --danger-bg:#FDF0EC;
    --warn-bg:#FFF6E8;
    --warn-border:#E2AE4E;
    --radius:14px;
    --shadow: 0 2px 8px rgba(22,35,63,0.06), 0 1px 2px rgba(22,35,63,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', -apple-system, 'Segoe UI', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  .topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;
    padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:32px;height:32px;border-radius:8px;
    background:var(--brand-orange);
    display:flex;align-items:center;justify-content:center;
    font-weight:500;color:#fff;font-size:16px;
  }
  .brand-name{ font-weight:700; font-size:16px; letter-spacing:0.2px; }
  .brand-sub{ font-size:12px; color:#B9C2D6; margin-top:1px; }
  .topbar .right{ display:flex; align-items:center; gap:12px; font-size:13px; color:#CBD3E3;}
  .badge-admin{
    background:var(--gold); color:var(--navy); font-weight:700;
    font-size:11px; padding:4px 10px; border-radius:100px; letter-spacing:0.3px;
  }
  .link-btn{
    background:none;border:1px solid rgba(255,255,255,0.35);color:#fff;
    padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;
    font-family:inherit; transition:background .15s;
  }
  .link-btn:hover{ background:rgba(255,255,255,0.12); }

  /* ---------- layout wrappers ---------- */
  .center-screen{
    flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .main-wrap{ flex:1; max-width:880px; width:100%; margin:0 auto; padding:28px 20px 60px; }
  .admin-wrap{ flex:1; max-width:1120px; width:100%; margin:0 auto; padding:28px 20px 60px; }

  /* ---------- card ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:32px;
  }
  .gate-card{ width:100%; max-width:400px; }
  .gate-title{ font-size:22px; font-weight:800; margin:0 0 6px; letter-spacing:-0.2px;}
  .gate-sub{ font-size:13.5px; color:var(--slate); margin:0 0 24px; line-height:1.5;}
  label{ display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px;}
  input[type=text], input[type=email], input[type=password], input[type=number]{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14.5px; font-family:inherit; color:var(--ink); background:#fff;
    transition:border-color .15s;
  }
  input:focus{ outline:none; border-color:var(--gold-dark); }
  .field{ margin-bottom:16px; }
  .hint{ font-size:12px; color:var(--slate-light); margin-top:5px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:13px 20px; border-radius:10px; font-size:14.5px; font-weight:700;
    cursor:pointer; border:none; font-family:inherit; transition:transform .08s, opacity .15s;
    width:100%;
  }
  .btn:active{ transform:scale(0.985); }
  .btn-primary{ background:var(--navy); color:#fff; }
  .btn-primary:hover{ background:var(--navy-2); }
  .btn-primary:disabled{ background:#B7BEC9; cursor:not-allowed; }
  .btn-gold{ background:var(--gold); color:var(--navy); }
  .btn-gold:hover{ background:var(--gold-dark); color:#fff; }
  .btn-gold:disabled{ background:#E9DDBC; color:#9C9271; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--slate); border:1.5px solid var(--line); }
  .btn-ghost:hover{ background:#F5F6F8; }
  .btn-danger-outline{ background:#fff; color:var(--danger); border:1.5px solid #EAC2B4; }
  .btn-danger-outline:hover{ background:var(--danger-bg); }
  .btn-sm{ width:auto; padding:8px 14px; font-size:13px; }
  .error-text{ color:var(--danger); font-size:13px; margin-top:10px; font-weight:600; }
  .success-text{ color:var(--success); font-size:13px; margin-top:10px; font-weight:600; }

  /* ---------- steps ---------- */
  .steps{ display:flex; gap:6px; margin-bottom:26px; }
  .step-pill{
    flex:1; height:5px; border-radius:100px; background:var(--line);
  }
  .step-pill.active{ background:var(--gold); }
  .step-pill.done{ background:var(--navy); }
  .step-label{ font-size:12.5px; color:var(--slate-light); font-weight:600; margin-bottom:4px; letter-spacing:0.3px; text-transform:uppercase;}
  .step-heading{ font-size:20px; font-weight:800; margin:0 0 22px; }

  /* ---------- date grid ---------- */
  .date-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(110px,1fr));
    gap:10px; margin-bottom:8px;
  }
  .date-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:10px;
    padding:12px 8px; text-align:center; cursor:pointer; transition:.12s;
  }
  .date-btn:hover{ border-color:var(--gold-dark); }
  .date-btn.selected{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .date-btn .dow{ font-size:11px; color:var(--slate-light); font-weight:600; }
  .date-btn.selected .dow{ color:#B9C2D6; }
  .date-btn .dnum{ font-size:16px; font-weight:800; margin-top:2px; }
  .date-btn .avail{ font-size:10.5px; margin-top:4px; color:var(--success); font-weight:600; }
  .date-btn.selected .avail{ color:#9FE3C4; }
  .date-btn.full{ opacity:0.4; cursor:not-allowed; }
  .date-btn.full .avail{ color:var(--danger); }
  .date-btn.closed{ opacity:0.55; cursor:not-allowed; background:#FAFAFB; border-style:dashed; }
  .date-btn.closed .avail{ color:var(--slate-light); }
  .date-btn.closed .dow, .date-btn.closed .dnum{ color:var(--slate-light); }

  .week-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .week-range{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .date-grid-week{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .week-cell{ padding:16px 8px; }
  @media (max-width:520px){
    .date-grid-week{ grid-template-columns:repeat(5,1fr); gap:6px; }
    .week-cell{ padding:10px 4px; }
    .week-cell .dnum{ font-size:13px; }
    .week-cell .avail{ font-size:9px; }
  }

  /* ---------- slot grid ---------- */
  .slot-section-label{ font-size:13px; font-weight:700; color:var(--slate); margin:18px 0 10px; }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:10px; }
  .slot-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:10px;
    padding:12px 8px; text-align:center; cursor:pointer; transition:.12s;
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px;
  }
  .slot-btn:hover{ border-color:var(--gold-dark); }
  .slot-btn.selected{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .slot-btn .cap{ font-family:'Inter',sans-serif; font-size:10.5px; color:var(--slate-light); margin-top:3px; font-weight:600;}
  .slot-btn.selected .cap{ color:#B9C2D6; }
  .slot-btn.full{ opacity:0.35; cursor:not-allowed; text-decoration:line-through; }

  /* ---------- warning boxes ---------- */
  .warn-box{
    border:2px solid var(--warn-border); background:var(--warn-bg); border-radius:12px;
    padding:18px 18px; margin-bottom:16px; display:flex; gap:12px; align-items:flex-start;
  }
  .warn-box .icon{ font-size:22px; line-height:1; }
  .warn-box .txt{ font-size:14.5px; line-height:1.6; font-weight:600; color:#5C4413; }
  .warn-box.strong{ border-color:var(--danger); background:var(--danger-bg); }
  .warn-box.strong .txt{ color:#7A2E1B; font-size:15px; }
  .agree-row{ display:flex; align-items:flex-start; gap:10px; margin-top:10px; }
  .agree-row input[type=checkbox]{ width:20px; height:20px; margin-top:2px; flex-shrink:0; accent-color:var(--navy); cursor:pointer;}
  .agree-row .agree-txt{ font-size:13.5px; color:var(--ink); font-weight:600; line-height:1.5; cursor:pointer;}

  /* ---------- ticket / confirmation ---------- */
  .ticket{
    border:2px dashed var(--navy); border-radius:16px; padding:28px;
    background:linear-gradient(135deg, #fff 0%, #F7F8FA 100%); position:relative; overflow:hidden;
  }
  .ticket::before, .ticket::after{
    content:''; position:absolute; width:24px; height:24px; background:var(--paper);
    border-radius:50%; top:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-12px; }
  .ticket::after{ right:-12px; }
  .ticket-eyebrow{ font-size:11px; font-weight:700; color:var(--gold-dark); letter-spacing:1.5px; text-transform:uppercase; }
  .ticket-name{ font-size:24px; font-weight:800; margin:6px 0 18px; }
  .ticket-row{ display:flex; justify-content:space-between; padding:10px 0; border-top:1px dashed var(--line); font-size:14px; }
  .ticket-row:first-of-type{ border-top:none; }
  .ticket-row .k{ color:var(--slate); font-weight:600; }
  .ticket-row .v{ font-weight:700; font-family:'JetBrains Mono',monospace; }

  /* ---------- admin tabs ---------- */
  .admin-tabs{ display:flex; gap:6px; margin-bottom:22px; border-bottom:1.5px solid var(--line); flex-wrap:wrap; }
  .admin-tab{
    padding:11px 16px; font-size:14px; font-weight:700; color:var(--slate); cursor:pointer;
    border-bottom:2.5px solid transparent; margin-bottom:-1.5px; transition:.12s; user-select:none;
  }
  .admin-tab.active{ color:var(--navy); border-bottom-color:var(--gold); }
  .admin-tab:hover{ color:var(--navy); }
  .admin-subtabs{ display:flex; gap:8px; margin:-14px 0 22px; flex-wrap:wrap; }
  .admin-subtab{
    padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--slate-light); cursor:pointer;
    border-radius:100px; background:#F5F6F8; user-select:none; transition:.12s;
  }
  .admin-subtab.active{ color:#fff; background:var(--navy); }
  .admin-subtab:hover{ color:var(--navy); }
  .admin-subtab.active:hover{ color:#fff; }
  .admin-mobile-menu-btn{ display:none; align-items:center; gap:10px; width:100%; padding:12px 14px; margin-bottom:18px; border:1.5px solid var(--line); border-radius:10px; background:#fff; font-size:14.5px; font-weight:700; font-family:inherit; color:var(--ink); cursor:pointer; text-align:left; }
  .admin-sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(15,23,42,0.45); z-index:200; opacity:0; transition:opacity .18s ease; }
  .admin-sidebar-overlay.open{ display:block; opacity:1; }
  .admin-sidebar{
    position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; background:#fff; z-index:201;
    transform:translateX(-100%); transition:transform .2s ease; overflow-y:auto; padding:16px 14px 30px;
    box-shadow:2px 0 16px rgba(15,23,42,0.18); display:none;
  }
  .admin-sidebar.open{ display:block; transform:translateX(0); }
  .admin-sidebar-close{ display:flex; justify-content:flex-end; margin-bottom:6px; }
  .admin-sidebar-group-label{
    font-size:11px; font-weight:800; color:var(--slate-light); text-transform:uppercase; letter-spacing:.04em;
    margin:16px 4px 4px; padding-top:10px; border-top:1px solid var(--line);
  }
  .admin-sidebar-group-label:first-child{ margin-top:0; padding-top:0; border-top:none; }
  .admin-sidebar-item{
    display:flex; align-items:center; justify-content:space-between; padding:11px 12px; border-radius:8px;
    font-size:14.5px; font-weight:600; color:var(--ink); cursor:pointer; user-select:none;
  }
  .admin-sidebar-item.active{ background:var(--navy); color:#fff; }
  .admin-sidebar-item:hover{ background:#F5F6F8; }
  .admin-sidebar-item.active:hover{ background:var(--navy); }

  /* ---------- calendar ---------- */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-title{ font-size:17px; font-weight:800; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow{ text-align:center; font-size:11.5px; font-weight:700; color:var(--slate-light); padding-bottom:6px; }
  .cal-cell{
    min-height:96px; border:1px solid var(--line); border-radius:10px; padding:6px 6px;
    background:#fff; font-size:11px;
  }
  .cal-cell.empty{ background:transparent; border:none; }
  .cal-cell.weekend{ background:#FAFAFB; }
  .cal-cell.is-closed{ background:#F4F4F5; }
  .cal-cell .dnum{ font-size:12px; font-weight:700; color:var(--slate); margin-bottom:4px; display:flex; align-items:center; justify-content:space-between; }
  .closed-tag{ font-size:9px; font-weight:700; color:var(--danger); background:var(--danger-bg); border-radius:5px; padding:1px 5px; text-transform:uppercase; }
  .cal-chip{
    background:var(--navy); color:#fff; border-radius:6px; padding:2px 6px; margin-bottom:3px;
    font-size:10.5px; font-weight:600; cursor:pointer; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal-chip:hover{ background:var(--gold-dark); }
  .cal-mobile-list{ display:none; }
  .cal-mobile-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 6px; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .cal-mobile-row.weekend{ background:#FAFBFC; }
  .cal-mobile-row.is-closed{ background:#F4F4F5; color:var(--slate-light); }
  .cal-mobile-row.is-today .cal-mobile-daynum{ color:var(--gold-dark); }
  .cal-mobile-date{ display:flex; align-items:baseline; gap:8px; }
  .cal-mobile-daynum{ font-size:15px; font-weight:800; color:var(--ink); min-width:22px; }
  .cal-mobile-dow{ font-size:11.5px; color:var(--slate-light); font-weight:600; }
  .cal-mobile-count{ font-size:12.5px; font-weight:700; color:var(--navy); cursor:pointer; }
  .td-mobile-label{ display:none; }

  /* ---------- table ---------- */
  table.list-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.list-table th{
    text-align:left; padding:10px 12px; background:var(--navy); color:#fff;
    font-weight:700; font-size:12.5px; letter-spacing:0.2px;
  }
  table.list-table th:first-child{ border-radius:8px 0 0 8px; }
  table.list-table th:last-child{ border-radius:0 8px 8px 0; }
  table.list-table td{ padding:11px 12px; border-bottom:1px solid var(--line); }
  table.list-table tr:hover td{ background:#FAFAFB; }
  .row-actions{ display:flex; gap:6px; }
  .tag{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; }

  /* ---------- settings ---------- */
  .settings-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .cap-item{ border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
  .cap-item .t{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; margin-bottom:6px;}
  .cap-item input{ padding:8px 10px; font-size:13px; }
  .section-title{ font-size:15px; font-weight:800; margin:0 0 4px; }
  .section-desc{ font-size:13px; color:var(--slate); margin:0 0 16px; }
  .divider{ height:1px; background:var(--line); margin:28px 0; }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(22,35,63,0.45); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px;
  }
  .modal{ background:#fff; border-radius:16px; padding:26px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
  .modal h3{ margin:0 0 16px; font-size:17px; font-weight:800; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--slate); font-size:14px; }
  .spin-wrap{ display:flex; align-items:center; justify-content:center; padding:80px 20px; color:var(--slate); font-size:14px;}

  .copy-box{ display:flex; gap:8px; margin:6px 0 18px; }
  .copy-box input{ flex:1; background:#F5F6F8; font-family:'JetBrains Mono',monospace; font-size:12px; }

  /* ---------- chat ---------- */
  .chat-panel{ border:1.5px solid var(--line); border-radius:12px; overflow:hidden; margin:16px 0; }
  .chat-thread{ max-height:420px; overflow-y:auto; padding:14px; background:#FAFBFC; display:flex; flex-direction:column; gap:8px; }
  .chat-empty{ text-align:center; color:var(--slate-light); font-size:12.5px; padding:20px 0; }
  .chat-system{ align-self:center; background:var(--gold-bg); color:var(--gold-dark); font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:100px; text-align:center; }
  .unread-badge{ background:var(--danger); color:#fff; font-size:10.5px; font-weight:800; border-radius:100px; padding:1px 7px; margin-left:4px; }
  .chat-bubble{ max-width:78%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; word-break:break-word; }
  .chat-bubble .t{ font-size:10px; opacity:0.65; margin-top:3px; }
  .chat-bubble.mine{ align-self:flex-end; background:var(--navy); color:#fff; border-bottom-right-radius:4px; }
  .chat-bubble.theirs{ align-self:flex-start; background:#fff; border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:4px; }
  .chat-bubble .who{ font-size:10.5px; font-weight:700; margin-bottom:2px; opacity:0.75; }
  .chat-unread-badge{ font-size:11px; font-weight:700; color:var(--gold); margin-bottom:2px; flex-shrink:0; }
  .chat-input-row{ display:flex; gap:8px; padding:10px; border-top:1.5px solid var(--line); background:#fff; }
  .chat-input-row input{ flex:1; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:13.5px; font-family:inherit; }
  .chat-input-row button{ width:auto; padding:10px 18px; }
  .find-link{ background:none; border:none; color:var(--slate); font-size:13px; font-weight:600; text-decoration:underline; cursor:pointer; font-family:inherit; margin-top:14px; }

  /* ---------- apply form ---------- */
  .apply-wrap{ max-width:640px; margin:0 auto; padding:32px 20px 60px; }
  .apply-section{ margin-bottom:28px; }
  .apply-section-title{ font-size:15px; font-weight:800; margin:0 0 4px; padding-bottom:8px; border-bottom:2px solid var(--line); }
  .apply-section-desc{ font-size:12.5px; color:var(--slate); margin:6px 0 16px; }
  /* Each question sits in its own clearly-bounded block — modeled on Google
     Forms, where every question is visually separate rather than a long
     unbroken list of labels and inputs. */
  .form-question{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:20px; }
  .form-section-banner{ background:var(--navy); color:#fff; padding:14px 22px; border-radius:12px; font-size:17px; font-weight:800; margin:32px 0 16px; white-space:pre-wrap; }
  .form-section-banner:first-child{ margin-top:0; }
  .form-section-desc{ font-size:13.5px; color:var(--ink); line-height:1.55; margin:10px 0 22px; padding:0 4px; white-space:pre-wrap; }
  textarea{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:14.5px; font-family:inherit; color:var(--ink); background:#fff; resize:vertical; min-height:90px; }
  select{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:14.5px; font-family:inherit; color:var(--ink); background:#fff; }
  .checkbox-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .checkbox-item{ display:flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px; font-size:12.5px; cursor:pointer; }
  .checkbox-item input{ width:16px; height:16px; accent-color:var(--navy); cursor:pointer; }
  .file-drop{ border:1.5px dashed var(--line); border-radius:10px; padding:16px; text-align:center; font-size:13px; color:var(--slate); }
  .file-drop input[type=file]{ display:block; margin:8px auto 0; font-size:12.5px; }
  .file-drop .fname{ font-weight:700; color:var(--ink); margin-top:6px; font-size:12.5px; }

  @media (max-width:600px){
    .card{ padding:22px 18px; }
    .topbar{ padding:14px 16px; }
    .cal-grid-desktop{ display:none; }
    .cal-mobile-list{ display:block; }
    table.list-table{ font-size:12px; }
    .admin-wrap, .main-wrap{ padding:18px 12px 40px; }

    /* Swaps the admin nav's wrapped rows of tab buttons (messy on a phone
       — often 2-3 lines of wrapped buttons before you even reach the page
       content) for a hamburger button that opens a slide-in sidebar.
       Desktop keeps the tab-button rows as-is. */
    .admin-tabs-desktop, .admin-subtabs-desktop{ display:none; }
    .admin-mobile-menu-btn{ display:flex; }

    /* Chat list only (scoped via .chat-list-table, not the shared
       .list-table class other admin tables use) — collapses the desktop
       4-column table into a stacked, tappable card per conversation
       showing just name / last message / unread count, since a wide
       table with a "When" column doesn't fit a phone screen usefully. */
    table.chat-list-table thead{ display:none; }
    table.chat-list-table, table.chat-list-table tbody, table.chat-list-table tr, table.chat-list-table td{
      display:block; width:100%;
    }
    table.chat-list-table tr{
      position:relative; border:1.5px solid var(--line); border-radius:12px;
      padding:12px 44px 12px 14px; margin-bottom:10px;
    }
    table.chat-list-table td{ padding:2px 0; border:none; font-size:13px; }
    table.chat-list-table td:nth-child(3){ display:none; } /* "When" timestamp */
    table.chat-list-table td:nth-child(4){ position:absolute; top:12px; right:14px; padding:0; }

    /* Demo list, Applications, and Archive tables — same card-per-row idea
       as the chat list, but these rows carry several dropdowns/buttons
       rather than one line of text, so cells just stack full-width instead
       of anything absolutely positioned. .mobile-hide drops columns that
       are useful on desktop but not essential to see at a glance on a
       phone (e.g. Booked At, Submitted, Score). */
    table.demo-list-table thead, table.app-list-table thead, table.archive-list-table thead{ display:none; }
    table.demo-list-table, table.demo-list-table tbody, table.demo-list-table tr, table.demo-list-table td,
    table.app-list-table, table.app-list-table tbody, table.app-list-table tr, table.app-list-table td,
    table.archive-list-table, table.archive-list-table tbody, table.archive-list-table tr, table.archive-list-table td{
      display:block; width:100%;
    }
    table.demo-list-table tr, table.app-list-table tr, table.archive-list-table tr{
      border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;
    }
    table.demo-list-table td, table.app-list-table td, table.archive-list-table td{ padding:5px 0; border:none; }
    table.demo-list-table td select, table.app-list-table td select,
    table.demo-list-table td input, table.demo-list-table td textarea{ width:100%; box-sizing:border-box; }
    table.demo-list-table .row-actions, table.app-list-table .row-actions, table.archive-list-table .row-actions{ margin-top:6px; }
    .td-mobile-label{ display:block; font-size:10px; font-weight:800; color:var(--slate-light); text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px; }
    table.mobile-hide, td.mobile-hide{ display:none; }
  }

  /* ---------- phone-sized screens: applicant/tutor booking + chat ----------
     A narrower, more deliberate breakpoint than the 600px one above, tuned
     for the screens an applicant or tutor actually uses on their own phone
     (gate/access-code entry, date/time picking, the confirmation ticket,
     and the chat thread) rather than the admin console, which stays
     desktop-oriented for now. */
  @media (max-width:480px){
    .center-screen{ padding:16px 14px; }
    .gate-card{ max-width:100%; }
    .card{ padding:18px 16px; border-radius:12px; }
    .gate-title{ font-size:19px; }
    .gate-sub{ font-size:13px; }
    .step-heading{ font-size:17px; margin-bottom:16px; }
    .step-label{ font-size:11.5px; }
    .brand-sub{ display:none; } /* topbar subtitle drops on very narrow screens to save space */
    .topbar .brand-name{ font-size:14.5px; }
    .topbar .right{ font-size:12px; gap:8px; }

    /* Every text input/select/textarea bumps to 16px here — below that,
       iOS Safari auto-zooms the whole page the moment the field is
       focused, which is a well-known, jarring mobile annoyance. This
       override only applies at this breakpoint so desktop sizing is
       untouched. */
    input[type=text], input[type=email], input[type=password], input[type=number],
    textarea, select, .chat-input-row input{ font-size:16px; }

    .date-grid-week{ gap:5px; }
    .week-cell{ padding:8px 2px; }
    .week-cell .dnum{ font-size:12px; }
    .week-cell .dow{ font-size:9px; }
    .week-cell .avail{ font-size:8px; }

    .slot-grid{ grid-template-columns:repeat(2,1fr); gap:8px; }
    .slot-btn{ font-size:13.5px; padding:11px 6px; }

    .ticket{ padding:18px; }
    .ticket-name{ font-size:19px; }
    .ticket-row{ font-size:13px; }

    /* Dynamic form fields (apply/device/signup) — the desktop padding on
       .form-question (20px 22px) eats too much of an already-narrow phone
       screen, and the section banner's generous margins push content
       further down than needed on a shorter viewport. */
    .form-question{ padding:14px 16px; margin-bottom:14px; }
    .form-section-banner{ padding:11px 16px; font-size:15px; margin:22px 0 12px; }
    .form-section-desc{ font-size:13px; margin:8px 0 16px; padding:0; }
    .apply-section{ margin-bottom:20px; }
    .field{ margin-bottom:12px; }

    .warn-box{ padding:14px; gap:9px; }
    .warn-box .txt{ font-size:13.5px; }
    .warn-box.strong .txt{ font-size:14px; }

    /* Taller phones have plenty of vertical room — let the thread use more
       of it (min() keeps it from ever exceeding the desktop cap) instead
       of leaving a fixed, comparatively small 420px box with dead space
       around it. */
    .chat-thread{ max-height:min(420px, 52vh); padding:10px; }
    .chat-bubble{ max-width:86%; font-size:13px; }
    .chat-input-row{ padding:8px; gap:6px; }
    .chat-input-row button{ padding:10px 14px; }
  }
</style>

/* ============================================================
   Constants
   ============================================================ */
const CONFIG_KEY = 'app-config';
const BOOKINGS_KEY = 'app-bookings';
const FORM_SCHEMAS_KEY = 'form-schemas';
const FORM_IMAGES_COLLECTION = 'formImages';

// Admin-uploaded reference images, stored as compressed base64 data URLs in
// Firestore (not Firebase Storage, which needs the paid Blaze plan). Keyed by
// document id; merged with the built-in FORM_REFERENCE_IMAGES at render time.
let customFormImages = {};
async function loadFormImages(){
  try{
    const snap = await db.collection(FORM_IMAGES_COLLECTION).get();
    customFormImages = {};
    snap.docs.forEach(doc => { customFormImages[doc.id] = doc.data(); });
  }catch(e){
    customFormImages = {};
  }
  return customFormImages;
}
async function saveFormImage(id, label, dataUrl){
  const data = { label, dataUrl, uploadedAt: new Date().toISOString() };
  await adminDb.collection(FORM_IMAGES_COLLECTION).doc(id).set(data);
  customFormImages[id] = data;
}
async function deleteFormImage(id){
  await adminDb.collection(FORM_IMAGES_COLLECTION).doc(id).delete();
  delete customFormImages[id];
}

// Admin-editable question sets for the Apply, Device, and Account Signup
// forms. Falls back to the built-in defaults (defined further below) until
// an admin customizes them, at which point the customized version is what
// everyone sees.
let formSchemas = { apply: null, device: null, signup: null };

// One-time-per-load migration: if a field's label has multiple lines (from
// before "description" existed as its own thing), split it so the first
// line becomes the title and everything after becomes the description.
// Leaves fields that already have a description, or a single-line label,
// untouched.
function migrateSchemaFieldDescriptions(schema){
  return (schema || []).map(field => {
    if(field.description || !field.label || !field.label.includes('\n')) return field;
    const lines = field.label.split('\n');
    return Object.assign({}, field, { label: lines[0], description: lines.slice(1).join('\n') });
  });
}

async function loadFormSchemas(){
  try{
    const res = await storage.get(FORM_SCHEMAS_KEY);
    const parsed = (res && res.value) ? JSON.parse(res.value) : {};
    formSchemas.apply = Array.isArray(parsed.apply) && parsed.apply.length ? parsed.apply : APPLY_FORM_DEFAULT_SCHEMA;
    formSchemas.device = Array.isArray(parsed.device) && parsed.device.length ? parsed.device : DEVICE_FORM_DEFAULT_SCHEMA;
    formSchemas.signup = Array.isArray(parsed.signup) && parsed.signup.length ? parsed.signup : SIGNUP_FORM_DEFAULT_SCHEMA;
  }catch(e){
    formSchemas.apply = APPLY_FORM_DEFAULT_SCHEMA;
    formSchemas.device = DEVICE_FORM_DEFAULT_SCHEMA;
    formSchemas.signup = SIGNUP_FORM_DEFAULT_SCHEMA;
  }
  formSchemas.apply = migrateSchemaFieldDescriptions(formSchemas.apply);
  formSchemas.device = migrateSchemaFieldDescriptions(formSchemas.device);
  formSchemas.signup = migrateSchemaFieldDescriptions(formSchemas.signup);
  return formSchemas;
}
async function saveFormSchemas(){
  await storage.set(FORM_SCHEMAS_KEY, JSON.stringify({ apply: formSchemas.apply, device: formSchemas.device, signup: formSchemas.signup }));
}

/* ------------------------------------------------------------
   Application form constants
   ------------------------------------------------------------ */
function halfHourBlocks(startH, startM, endH, endM){
  const blocks = [];
  let h = startH, m = startM;
  const pad = n => String(n).padStart(2,'0');
  while(h < endH || (h === endH && m < endM)){
    let nh = h, nm = m + 30;
    if(nm >= 60){ nh += 1; nm -= 60; }
    blocks.push(`${pad(h)}:${pad(m)} - ${pad(nh)}:${pad(nm)}`);
    h = nh; m = nm;
  }
  return blocks;
}
const WEEKDAY_MORNING_BLOCKS = halfHourBlocks(5,30,8,30);
const WEEKDAY_EVENING_BLOCKS = halfHourBlocks(17,0,23,0);
const WEEKEND_BLOCKS = (() => {
  const blocks = []; let h = 6;
  while(h < 23){ blocks.push(`${String(h).padStart(2,'0')}:00 - ${String(h+1).padStart(2,'0')}:00`); h++; }
  return blocks;
})();

// Shared result options for both 1st and 2nd Demo result dropdowns.
const DEMO_RESULT_OPTIONS = [
  {value:'', label:'Pending'},
  {value:'pass', label:'Pass'},
  {value:'fail', label:'Fail'},
  {value:'noShow', label:'No Show'},
  {value:'withdraw', label:'Withdraw'}
];
function renderResultSelect(dataAttr, id, currentValue){
  return `<select data-${dataAttr}="${id}" style="font-size:12.5px; padding:6px 8px; border:1.5px solid var(--line); border-radius:7px; font-family:inherit;">
    ${DEMO_RESULT_OPTIONS.map(o=>`<option value="${o.value}" ${currentValue===o.value?'selected':''}>${o.label}</option>`).join('')}
  </select>`;
}

// Year/Month/Day dropdown trio — used instead of a native <input type="date">
// so clicking anywhere opens a plain dropdown (no calendar-icon-only quirk).
// Single dropdown of upcoming dates, styled the same way as the 1st Demo's
// "Reassign slot" date picker (e.g. "Jul 24 (Fri)") — but including every day
// of the week, not just weekdays, since 2nd Demo can be scheduled any day.
// 15-minute increments from 09:00 through 23:45, for the 2nd Demo time picker.
const TIME_15MIN_OPTIONS = (() => {
  const out = [];
  for(let h=9; h<24; h++){
    for(let m=0; m<60; m+=15){
      out.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
    }
  }
  return out;
})();
function renderSingleTimeSelect(dataAttr, id, currentValue){
  const options = TIME_15MIN_OPTIONS.map(t=>`<option value="${t}" ${currentValue===t?'selected':''}>${t}</option>`).join('');
  const placeholder = currentValue ? '' : `<option value="">Select a time…</option>`;
  return `<select data-${dataAttr}="${id}" style="font-size:12.5px; padding:6px 8px; border:1.5px solid var(--line); border-radius:7px; font-family:inherit;">
    ${placeholder}${options}
  </select>`;
}


function renderSingleDateSelect(dataAttr, id, currentDateStr){
  const dates = upcomingDays(60);
  const options = dates.map(d=>{
    const ds = fmtDate(d);
    return `<option value="${ds}" ${currentDateStr===ds?'selected':''}>${fmtDateLabel(ds)}</option>`;
  }).join('');
  const placeholder = currentDateStr ? '' : `<option value="">Select a date…</option>`;
  return `<select data-${dataAttr}="${id}" style="font-size:12.5px; padding:6px 8px; border:1.5px solid var(--line); border-radius:7px; font-family:inherit;">
    ${placeholder}${options}
  </select>`;
}

// Default assignee rules for newly-created bookings:
// - 08:15–10:15 (all AM slots)      -> Lyn
// - 12:00–13:30                      -> capacity 1: Sabrina. capacity 2+: alternates Lyn/Sabrina by seat position
// - 14:00 onward                     -> Sabrina
// Admin can always override this afterward from the List tab.
function defaultAssigneeFor(date, time){
  const [h,m] = time.split(':').map(Number);
  const totalMin = h*60 + m;
  if(totalMin <= 10*60 + 30) return 'Lyn';
  if(totalMin < 14*60){
    const cap = slotCapacityFor(date, time);
    const existingCount = slotsUsed(date, time); // bookings already in this slot, before this new one
    if(cap <= 1) return 'Sabrina';
    return existingCount % 2 === 0 ? 'Lyn' : 'Sabrina';
  }
  return 'Sabrina';
}

// separate from the default one (which tutors sign into). Firebase Auth's
// default persistence is shared across every tab of the same browser, so
// without this, an admin tab open in the background would "see" a tutor

// admin/tutor sessions from interfering with each other), reads made through
// the default `db` never carry the admin's auth token and silently fail the
// rules check — hence a dedicated Firestore instance tied to adminApp for
// every admin-gated read/write.

// Creates a Firebase Auth account for a passed tutor and returns the
// temporary password, so the admin can send it themselves via a pre-filled
// Gmail compose window — the same pattern already used for applicant
// invites — instead of relying on Firebase's own transactional email, which
// isn't reliably arriving.
//
// The tricky part: calling createUserWithEmailAndPassword on the normal auth
// instance would sign the ADMIN out and sign in as the new tutor instead.
// To avoid that, we spin up a throwaway secondary Firebase app just for this
// one operation, then tear it down — the admin's own session never moves.
function generateTutorTempPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let pass = '';
  for(let i=0; i<10; i++) pass += chars[Math.floor(Math.random()*chars.length)];
  return pass;
}
async function inviteTutorAccount(email){
  const secondaryApp = firebase.initializeApp(firebaseConfig, 'tutor-invite-' + Date.now());
  const tempPassword = generateTutorTempPassword();
  try{
    const secondaryAuth = secondaryApp.auth();
    await secondaryAuth.createUserWithEmailAndPassword(email, tempPassword);
    await secondaryAuth.signOut();
  } finally {
    await secondaryApp.delete();
  }
  return tempPassword;
}

// Deletes the actual Storage file behind a download URL — used whenever a
// record or message with an attachment gets deleted, so the file doesn't
// sit around in Storage forever with nothing left pointing to it.
async function deleteStorageFileByUrl(url){
  if(!url) return;
  try{
    await fbStorage.refFromURL(url).delete();
  }catch(e){
    // Not fatal — the record deletion should still proceed even if the
    // underlying file was already gone or briefly unreachable.
    console.error('Failed to delete storage file:', url, e);
  }
}
// Finds every "...Url" field on a record (verificationImageUrl, recordingUrl,
// etc.) and deletes each corresponding Storage file in parallel.
async function deleteAttachedFiles(record){
  if(!record) return;
  const urlKeys = Object.keys(record).filter(k => k.endsWith('Url') && record[k]);
  await Promise.all(urlKeys.map(k => deleteStorageFileByUrl(record[k])));
}

const storage = {
  async get(key){
    const snap = await db.collection(KV_COLLECTION).doc(key).get();
    if(!snap.exists) return { key, value: null };
    return { key, value: snap.data().value };
  },
  async set(key, value){
    const stringValue = typeof value === 'string' ? value : JSON.stringify(value);
    await adminDb.collection(KV_COLLECTION).doc(key).set({ value: stringValue });
    return { key, ok: true };
  }
};

async function loadConfig(){
  try{
    const res = await storage.get(CONFIG_KEY);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      const sc = parsed.slotCapacity || {};
      const firstVal = Object.values(sc)[0];
      const isOldFlatFormat = firstVal != null && typeof firstVal === 'number';
      let merged = {};
      if(isOldFlatFormat){
        // migrate: old format was { time: cap } applied to every day
        WEEKDAY_NUMS.forEach(d => { merged[d] = Object.assign({}, freshDayCapacity(), sc); });
      } else {
        WEEKDAY_NUMS.forEach(d => { merged[d] = Object.assign({}, freshDayCapacity(), sc[d] || {}); });
      }
      parsed.slotCapacity = merged;
      parsed.closedDates = parsed.closedDates || [];
      if(!parsed.adminCode) parsed.adminCode = DEFAULT_CONFIG.adminCode; // safety net if an in-progress login-based config was saved
      config = parsed;
    } else {
      config = DEFAULT_CONFIG;
      await storage.set(CONFIG_KEY, JSON.stringify(config));
    }
  }catch(e){
    config = DEFAULT_CONFIG;
    try{ await storage.set(CONFIG_KEY, JSON.stringify(config)); }catch(e2){}
  }
}
async function saveConfig(next){
  const previous = config;
  config = next; // optimistic update for instant UI feedback
  try{
    await storage.set(CONFIG_KEY, JSON.stringify(config));
  }catch(e){
    config = previous; // roll back — the write didn't actually stick
    throw e;
  }
}

// Chat messages live in a subcollection under each booking, rather than an
// array field on the booking document itself — a single Firestore document
// has a 1MB size cap, and an array of every message ever exchanged with one
// tutor would eventually approach that after months of daily chatting. The
// booking document keeps lightweight "lastMessage*" and unread-count summary
// fields so lists/notifications never need to read the subcollection at all.
const MESSAGES_SUBCOLLECTION = 'messages';

// Same loadBookings()/saveBookings(next) signatures as before — every
// existing call site throughout the app keeps working unchanged. Internally,
// though, this now stores one Firestore document PER BOOKING instead of one
// giant array in a single document. That was the actual bottleneck behind
// the concurrency test results: a single hot document can only sustain
// ~1 write/sec before Firestore starts throttling/erroring, and every
// booking creation, chat message, and admin edit was hitting that same
// document. Splitting into one-doc-per-booking removes that contention
// almost entirely (each booking's writes are now isolated).
// Looks up a booking by email via a Cloud Function instead of a direct
// Firestore query. Firestore security rules can't safely allow "query the
// whole bookings collection by email" for unauthenticated visitors — that's
// indistinguishable, rules-wise, from "read every booking" — so this one
// specific lookup runs server-side with elevated (Admin SDK) access instead,
// and returns only the single matching record.

// Function — same reasoning as findBookingByEmail: an unauthenticated
// visitor can't be allowed to query the whole bookings collection just to
// answer "does this email already exist", so it's answered server-side.

  return !!(result.data && result.data.available);

// The separate test code that bypasses the invited-email check (see
// checkAdminTestCode in functions/index.js) — unset by default, since most
// admins won't need it and it's a real bypass, not something to enable
// casually.
async function loadBookings(){
  try{
    const snap = await db.collection(BOOKINGS_COLLECTION).get();
    bookings = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    if(bookings.length === 0){
      // One-time, automatic migration: if the old single-document blob still
      // has data and the new collection is empty, copy it over. Safe to run
      // every time the collection happens to be empty — once migrated, the
      // collection is no longer empty, so this never re-runs.
      try{
        const legacy = await storage.get(BOOKINGS_KEY);
        if(legacy && legacy.value){
          const legacyBookings = JSON.parse(legacy.value);
          if(Array.isArray(legacyBookings) && legacyBookings.length > 0){
            const batch = db.batch();
            legacyBookings.forEach(b => {
              const { id, ...data } = b;
              batch.set(db.collection(BOOKINGS_COLLECTION).doc(id), data);
            });
            await batch.commit();
            bookings = legacyBookings;
          }
        }
      }catch(e){ /* no legacy data to migrate — that's fine */ }
    }
  }catch(e){
    bookings = [];
  }
  return bookings;
}
async function saveBookings(next){
  const previous = bookings;
  // Diff against what we had before, so we only touch the documents that
  // actually changed (or got added/removed) — not every booking every time.
  const nextIds = new Set(next.map(b=>b.id));
  const toDelete = previous.filter(b => !nextIds.has(b.id));
  const toUpsert = next.filter(b => {
    const old = previous.find(p=>p.id===b.id);
    return !old || JSON.stringify(old) !== JSON.stringify(b);
  });
  bookings = next; // optimistic update for instant UI feedback
  try{
    const batch = db.batch();
    toUpsert.forEach(b => {
      const { id, ...data } = b;
      batch.set(db.collection(BOOKINGS_COLLECTION).doc(id), data);
    });
    toDelete.forEach(b => {
      batch.delete(db.collection(BOOKINGS_COLLECTION).doc(b.id));
    });
    await batch.commit();
  }catch(e){
    bookings = previous; // roll back — the write didn't actually stick
    throw e;
  }
}

/* ============================================================
   Chat helpers (per-booking message thread)
   ============================================================ */
async function sendChatMessage(bookingId, from, text, fileInfo){
  const trimmed = (text||'').trim();
  if(!trimmed && !fileInfo) return false;
  const msg = { from, text: trimmed, at: new Date().toISOString() };
  if(fileInfo){ msg.fileUrl = fileInfo.url; msg.fileName = fileInfo.name; msg.fileType = fileInfo.type; }

  const bookingRef = db.collection(BOOKINGS_COLLECTION).doc(bookingId);
  const msgRef = bookingRef.collection(MESSAGES_SUBCOLLECTION).doc();
  const summaryPatch = {
    lastMessageText: trimmed || (fileInfo ? '📎 Sent a file' : ''),
    lastMessageAt: msg.at,
    lastMessageFrom: from
  };
  // Whoever DIDN'T send this message gets their unread counter bumped —
  // reset back to 0 by markChatReadByAdmin/markChatReadByApplicant.
  summaryPatch[from === 'admin' ? 'unreadCountForApplicant' : 'unreadCountForAdmin'] = firebase.firestore.FieldValue.increment(1);

  // One atomic write across the new message doc + the parent's summary
  // fields — either both land or neither does.
  const batch = db.batch();
  batch.set(msgRef, msg);
  batch.update(bookingRef, summaryPatch);
  await batch.commit();
  // Deliberately NOT also pushing this message into the local `bookings`
  // array here — the real-time subcollection listener already watching this
  // booking (via startChatPolling) reflects Firestore's own local-write
  // cache the moment this update lands, often before this line would even
  // run. Doing both was adding the same message twice to the in-memory array.
  return true;
}
// Turns any http(s) URL inside an already-escaped message into a clickable
// link, so recipients can just tap it instead of having to copy-paste.
function linkify(escapedText){
  return escapedText.replace(/(https?:\/\/[^\s<]+)/g, url =>
    `<a href="${url}" target="_blank" rel="noopener" style="color:inherit; text-decoration:underline;">${url}</a>`
  );
}
function renderChatFileAttachment(m){
  if(!m.fileUrl) return '';
  const type = m.fileType || '';
  const name = m.fileName || 'file';
  if(type.startsWith('image/')){
    return `<a href="${escapeHtml(m.fileUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(m.fileUrl)}" alt="${escapeHtml(name)}" style="max-width:100%; max-height:220px; border-radius:8px; margin-top:6px; display:block;"></a>`;
  }
  if(type.startsWith('audio/')){
    return `<audio controls src="${escapeHtml(m.fileUrl)}" style="width:100%; margin-top:6px;"></audio>`;
  }
  return `<a href="${escapeHtml(m.fileUrl)}" target="_blank" rel="noopener" class="chat-file-link" style="display:flex; align-items:center; gap:6px; margin-top:6px; padding:8px 10px; border-radius:8px; background:rgba(0,0,0,0.06); text-decoration:none; color:inherit; font-size:12.5px;">📎 ${escapeHtml(name)}</a>`;
}
function renderChatThread(messages, viewerRole, bookingId, lastReadByApplicant, theirName, lastReadByAdmin){
  const msgs = messages || [];
  if(msgs.length === 0){
    return `<div class="chat-empty">No messages yet. Say hello!</div>`;
  }
  const canDelete = viewerRole === 'admin';
  const applicantReadCutoff = lastReadByApplicant ? new Date(lastReadByApplicant) : null;
  const adminReadCutoff = lastReadByAdmin ? new Date(lastReadByAdmin) : null;

  return msgs.map((m, i) => {
    if(m.from === 'system'){
      return `<div class="chat-system">${linkify(escapeHtml(m.text))}</div>`;
    }
    const mine = m.from === viewerRole;
    const who = m.from === 'admin' ? 'Admin' : (theirName || 'Applicant');
    const time = new Date(m.at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    // Admin sees a "1" on every admin message the applicant hasn't read yet
    // (a read-receipt, same as before) AND on every applicant message admin
    // hasn't read yet — the latter matters because scrolling through the
    // thread to answer one flagged message could otherwise look like every
    // applicant message above it was already seen, when it wasn't.
    let unreadBadge = '';
    if(viewerRole === 'admin' && m.from === 'admin'){
      const seen = applicantReadCutoff && new Date(m.at) <= applicantReadCutoff;
      if(!seen) unreadBadge = `<span class="chat-unread-badge">1</span>`;
    } else if(viewerRole === 'admin' && m.from === 'applicant'){
      const seen = adminReadCutoff && new Date(m.at) <= adminReadCutoff;
      if(!seen) unreadBadge = `<span class="chat-unread-badge">1</span>`;
    }
    const bubble = `<div class="chat-bubble ${mine?'mine':'theirs'}">
      <div class="who">${mine ? 'You' : who}${canDelete ? ` <button class="link-btn" data-delete-msg="${escapeHtml(bookingId)}" data-msg-id="${escapeHtml(m.id||'')}" style="font-size:10.5px; padding:0; margin-left:6px; color:var(--danger);" title="Delete message">🗑</button>` : ''}</div>
      ${m.text ? linkify(escapeHtml(m.text).replace(/\n/g,'<br>')) : ''}
      ${renderChatFileAttachment(m)}
      <div class="t">${time}</div>
    </div>`;
    if(!unreadBadge) return bubble;
    // Wrap in a row so the unread "1" sits just outside the bubble, on the
    // side it's read from (left of a sent/mine bubble) — KakaoTalk-style,
    // instead of a text label taking up room inside the bubble itself.
    return `<div style="display:flex; align-items:flex-end; gap:4px; justify-content:${mine?'flex-end':'flex-start'};">
      ${mine ? unreadBadge : ''}
      ${bubble}
      ${!mine ? unreadBadge : ''}
    </div>`;
  }).join('');
}
// Now just reads a running counter maintained on the booking document
// itself (incremented on send, reset to 0 on read) — no need to read the
// messages subcollection at all just to show a badge count.
function unreadCountForAdmin(b){
  return b.unreadCountForAdmin || 0;
}
async function markChatReadByAdmin(bookingId){
  const now = new Date().toISOString();
  await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({ lastReadByAdmin: now, unreadCountForAdmin: 0 });
  const idx = bookings.findIndex(b => b.id === bookingId);
  if(idx !== -1) bookings[idx] = Object.assign({}, bookings[idx], { lastReadByAdmin: now, unreadCountForAdmin: 0 });
  // Checking a booking's chat for the first time is a clear, natural signal
  // that admin has looked at it — covers cases like marking a 2nd demo
  // result straight from the quick dropdown in the list, which (unlike
  // clicking "Change") never otherwise touched viewedByAdmin, leaving a
  // stale "NEW" badge behind even after the booking moved on to onboarding.
  markBookingViewed(bookingId);
}
// Mirror of the above, but tracking whether the APPLICANT/TUTOR has seen the
// ADMIN's messages — powers the "Seen" read-receipt shown under the
// admin's own messages in the chat thread.
function unreadCountForApplicant(b){
  return b.unreadCountForApplicant || 0;
}
async function markChatReadByApplicant(bookingId){
  const now = new Date().toISOString();
  await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({ lastReadByApplicant: now, unreadCountForApplicant: 0 });
  const idx = bookings.findIndex(b => b.id === bookingId);
  if(idx !== -1) bookings[idx] = Object.assign({}, bookings[idx], { lastReadByApplicant: now, unreadCountForApplicant: 0 });
  // Clears the Home Screen icon badge for the case where the user opened
  // the app directly instead of tapping the push notification (which
  // clears it itself, see sw.js's notificationclick handler) — otherwise
  // a stale badge number would linger even after everything's been read.
  if(typeof navigator !== 'undefined' && 'clearAppBadge' in navigator){
    navigator.clearAppBadge().catch(()=>{});
  }
  // Also closes any still-showing push notification for this booking.
  // Matters because Android only re-vibrates/re-sounds a grouped (same-tag)
  // notification when it's genuinely NEW rather than an update to one
  // that's still on screen — so proactively closing it here means the
  // *next* message after this one is guaranteed to alert normally instead
  // of silently updating an unread notification the user never dismissed.
  if(typeof navigator !== 'undefined' && 'serviceWorker' in navigator){
    navigator.serviceWorker.ready.then(reg => {
      if(!reg.getNotifications) return;
      return reg.getNotifications({ tag: 'chat-' + bookingId });
    }).then(notifs => {
      (notifs || []).forEach(n => n.close());
    }).catch(()=>{});
  }
}

// Sends the applicant's message and updates the booking's summary fields.
// The guideline auto-send (when their message mentions their own name) used
// to be triggered from right here — but that meant an unauthenticated
// applicant's own browser was the one writing messages tagged `from:
// 'admin'`, which no rule can safely allow (there's no way to tell that
// write apart from someone impersonating admin in someone else's chat).
// That trigger now lives server-side, in the autoSendGuidelineOnNameMention
// Cloud Function — it watches for new applicant messages and sends the
// guideline sequence itself, with real Admin SDK privileges.
async function sendApplicantMessage(bookingId, text, fileInfo){
  const trimmed = (text||'').trim();
  if(!trimmed && !fileInfo) return false;
  const idx = bookings.findIndex(b => b.id === bookingId);
  if(idx === -1) return false;
  const msg = { from:'applicant', text: trimmed, at: new Date().toISOString() };
  if(fileInfo){ msg.fileUrl = fileInfo.url; msg.fileName = fileInfo.name; msg.fileType = fileInfo.type; }

  const bookingRef = db.collection(BOOKINGS_COLLECTION).doc(bookingId);
  const msgRef = bookingRef.collection(MESSAGES_SUBCOLLECTION).doc();
  const summaryPatch = {
    lastMessageText: trimmed || (fileInfo ? '📎 Sent a file' : ''),
    lastMessageAt: msg.at,
    lastMessageFrom: 'applicant',
    unreadCountForAdmin: firebase.firestore.FieldValue.increment(1)
  };
  const batch = db.batch();
  batch.set(msgRef, msg);
  batch.update(bookingRef, summaryPatch);
  await batch.commit();
  // No manual local `bookings` update here — see the matching note in
  // sendChatMessage(). The real-time listener already reflects this the
  // moment the write lands, and doing both was doubling the message.
  return true;
}

let chatPollBookingId = null;
let chatMessagesUnsubscribe = null;
let chatDocUnsubscribe = null;
// One-time, lazy migration for bookings created BEFORE the switch to a
// messages subcollection — their real chat history still lives in an
// embedded `messages` array field on the booking document itself, which the
// subcollection listener below has no way to see (it only reads documents
// actually inside the subcollection, which is empty for these). Copies that
// array into the subcollection as real message documents, then removes the
// stale field so this only ever runs once per booking. Runs before the
// subcollection listener attaches, so it never observes a false "empty"
// state for one of these bookings.
async function migrateLegacyMessagesIfNeeded(bookingId){
  try{
    const bookingRef = db.collection(BOOKINGS_COLLECTION).doc(bookingId);
    const doc = await bookingRef.get();
    if(!doc.exists) return;
    const legacyMessages = doc.data().messages;
    if(!Array.isArray(legacyMessages) || legacyMessages.length === 0) return;
    const subSnap = await bookingRef.collection(MESSAGES_SUBCOLLECTION).limit(1).get();
    if(!subSnap.empty){
      // Subcollection already has real data (migration already happened, or
      // new messages arrived since) — just clear the stale field so this
      // check doesn't keep re-running for this booking.
      await bookingRef.update({ messages: firebase.firestore.FieldValue.delete() });
      return;
    }
    const batch = db.batch();
    legacyMessages.forEach(m => {
      batch.set(bookingRef.collection(MESSAGES_SUBCOLLECTION).doc(), m);
    });
    batch.update(bookingRef, { messages: firebase.firestore.FieldValue.delete() });
    await batch.commit();
  }catch(e){
    console.error('Legacy message migration failed for booking', bookingId, e);
  }
}
// Two listeners run together while a chat is open: one on the messages
// subcollection (for the thread itself), and one on the parent booking
// document (for lastReadByAdmin/lastReadByApplicant and anything else
// about the booking) — needed because the "Seen" read receipt lives on the
// booking doc, not in the messages subcollection, and wouldn't otherwise
// update in real time while the other side is actively reading. Each
// listener's callback merges into the shared local booking object without
// clobbering what the other one contributed.
function startChatPolling(bookingId, onTick){
  if(chatPollBookingId === bookingId) return; // already listening to this thread
  stopChatPolling();
  chatPollBookingId = bookingId;
  const bookingRef = db.collection(BOOKINGS_COLLECTION).doc(bookingId);

  chatDocUnsubscribe = bookingRef.onSnapshot(doc => {
    if(!doc.exists) return;
    const freshFields = Object.assign({ id: doc.id }, doc.data());
    if(bookingId === bk.id && typeof freshFields.pushDisabled === 'boolean'){
      chatNotificationsEnabled = !freshFields.pushDisabled;
    }
    // Admin inviting them as a tutor (creating their login account) while
    // they already have this exact chat open live — the applicant session
    // they're looking at can't be used anymore (the "remembered booking"
    // restore already refuses to restore once tutorAccountCreated is
    // true), so rather than leaving them on a chat that silently stops
    // working, bump them straight to tutor sign-in with an explanation.
    // Only for their own currently-open session (bookingId === bk.id) and
    // only if they're not ALREADY signed in as a tutor themselves (that
    // would be admin or another tutor viewing this booking, not this
    // applicant's own browser).
    if(bookingId === bk.id && !currentTutorUser && freshFields.tutorAccountCreated === true && !bk.tutorAccountCreated){
      stopChatPolling();
      forgetMyBooking();
      gateInfoMessage = "🎉 You've been invited as a tutor! Please sign in with the new login info sent to your email.";
      gateMode = 'tutorLogin';
      cameFromTutorLink = true;
      view = 'gate';
      bk = { step:1, date:null, time:null, fullName:'', email:'', agree1:false, agree2:false, error:'', busy:false, done:false, weekOffset:0 };
      render();
      return;
    }
    const idx = bookings.findIndex(b => b.id === bookingId);
    const existingMessages = idx !== -1 ? bookings[idx].messages : undefined;
    const merged = existingMessages ? Object.assign(freshFields, { messages: existingMessages }) : freshFields;
    if(idx !== -1) bookings[idx] = merged; else bookings.push(merged);
    onTick();
  }, err => console.error('Chat doc listener error:', err));

  migrateLegacyMessagesIfNeeded(bookingId).finally(() => {
    // If the person already navigated away from this chat before the
    // migration check finished, don't attach a listener for a thread
    // that's no longer being viewed.
    if(chatPollBookingId !== bookingId) return;
    chatMessagesUnsubscribe = bookingRef.collection(MESSAGES_SUBCOLLECTION).orderBy('at', 'asc').onSnapshot(snap => {
      const messages = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
      const idx = bookings.findIndex(b => b.id === bookingId);
      if(idx !== -1){
        bookings[idx] = Object.assign({}, bookings[idx], { messages });
      } else {
        bookings.push({ id: bookingId, messages });
      }
      onTick();
    }, err => console.error('Chat messages listener error:', err));
  });
}
function stopChatPolling(){
  if(chatDocUnsubscribe) chatDocUnsubscribe();
  if(chatMessagesUnsubscribe) chatMessagesUnsubscribe();
  chatDocUnsubscribe = null;
  chatMessagesUnsubscribe = null;
  chatPollBookingId = null;
}

// Auto-refreshes the admin Applications list so new submissions show up
// without needing to log out/in again. Skips re-rendering while a modal is
// open (detail view, delete confirm) so it doesn't interrupt active edits —
// it still fetches in the background and catches up on the next render.
let appsUnsubscribe = null;
let appsListenerActive = false;
// Shared guard: true while the person is actively focused on any form
// control (a dropdown they just opened, a text field, etc). Used by every
// listener below so an auto-refresh never interrupts an in-progress
// selection or edit — including native <select> dropdowns, which don't
// have their own "is this open" state we can check directly.
//
// Search/filter boxes are deliberately excluded: they restore their typed
// value and cursor position on every render (see their .focus() +
// selectionStart/End calls in attachHandlers), so re-rendering around them
// is safe. Blocking on them just because they're focused — which happens
// automatically on tab entry and then stays true indefinitely — was
// silently freezing real-time updates on every list with a search box until
// the person clicked away from it.
const SEARCH_INPUT_IDS_SAFE_TO_RERENDER = new Set([
  'chatsSearchInput', 'tutorChatsSearchInput', 'formerTutorsSearchInput',
  'archiveAppSearchInput', 'archiveSearchInput'
]);
function isFormControlFocused(){
  const el = document.activeElement;
  if(!el) return false;
  if(SEARCH_INPUT_IDS_SAFE_TO_RERENDER.has(el.id)) return false;
  return ['SELECT','INPUT','TEXTAREA'].includes(el.tagName);
}

// All four of these switched from setInterval-based polling (re-reading the
// entire collection every few seconds regardless of whether anything
// changed) to Firestore's real-time listeners. Firestore only bills for
// documents that actually changed after the initial snapshot, so this scales
// with actual activity instead of with (collection size × how long the tab
// stays open) — the same UI, but far cheaper as data grows, and updates
// arrive instantly instead of on the next poll tick.
//
// The "active" flag is set BEFORE calling onSnapshot (not after, from its
// return value) — onSnapshot's first callback can fire synchronously, and
// that callback re-renders, which re-runs this same start function; without
// a guard set up-front, that re-entrant call wouldn't yet see an assigned
// unsubscribe handle and would subscribe a second time, recursing forever.
function startApplicationsPolling(){
  if(appsListenerActive) return;
  appsListenerActive = true;
  appsUnsubscribe = adminDb.collection(APPLICATIONS_COLLECTION).onSnapshot(snap => {
    applications = snap.docs.map(doc => Object.assign({ id: doc.id }, doc.data()));
    if(view==='admin' && adminTab==='applications' && !applicationDetailTarget && !reapplicationHistoryTarget && !isFormControlFocused()){
      render();
    }
  }, err => console.error('Applications listener error:', err));
}
function stopApplicationsPolling(){
  if(appsUnsubscribe) appsUnsubscribe();
  appsUnsubscribe = null;
  appsListenerActive = false;
}

// Same idea, but for bookings — covers Calendar/List/2nd Demo/Onboarding/
// Chats/Tutor Chats/Archive tabs, all of which read from the same
// collection. Skips re-rendering while any modal is open (edit, cancel,
// chat) so it doesn't interrupt an active edit; it still updates the local
// cache in the background either way.
let bookingsUnsubscribe = null;
let bookingsListenerActive = false;
function startBookingsPolling(){
  if(bookingsListenerActive) return;
  bookingsListenerActive = true;
  bookingsUnsubscribe = db.collection(BOOKINGS_COLLECTION).onSnapshot(snap => {
    const oldById = {};
    bookings.forEach(b => { oldById[b.id] = b; });
    const newBookings = snap.docs.map(doc => {
      const data = Object.assign({ id: doc.id }, doc.data());
      // Messages now live in a subcollection, not in this document's own
      // data — this collection-wide listener never sees them. Whatever a
      // dedicated startChatPolling() subscription already attached locally
      // (for whichever chat happens to be open) needs to survive this
      // refresh rather than getting silently wiped back to nothing.
      const old = oldById[doc.id];
      if(old && old.messages) data.messages = old.messages;
      return data;
    });
    if(view==='admin'){
      // Detect newly-arrived applicant/tutor messages across EVERY booking
      // (not just whichever chat is currently open) so admin gets notified
      // even while browsing a list instead of a specific conversation —
      // driven by the lightweight lastMessage* summary fields instead of
      // reading each booking's messages subcollection.
      newBookings.forEach(nb => {
        const prevAt = chatKnownLastMessageAt[nb.id];
        // Skip the very first snapshot for a booking — otherwise every
        // pre-existing conversation would fire a notification the moment
        // the listener starts, instead of only genuinely new messages.
        if(prevAt !== undefined && nb.lastMessageAt && nb.lastMessageAt !== prevAt && nb.lastMessageFrom === 'applicant'){
          maybeShowChatNotification(nb.adminChatLabel || nb.fullName, nb.lastMessageText, nb.id, chatTarget ? chatTarget.id : null);
        }
        chatKnownLastMessageAt[nb.id] = nb.lastMessageAt || null;
      });
    }
    bookings = newBookings;
    if(view==='admin' && (adminTab==='calendar' || adminTab==='list' || adminTab==='secondDemo' || adminTab==='onboarding' || adminTab==='chats' || adminTab==='tutorChats' || adminTab==='tutorList' || adminTab==='resignedTutors' || adminTab==='terminatedTutors' || adminTab==='archiveApplicants' || adminTab==='archiveTutors') && !editingBooking && !cancelTarget && !chatTarget && !notesTarget && !editingSecondDemo && !dayDetailTarget && !signupStatusTarget && !editingTutorChatLabelId && !applicationDetailTarget && !deleteTutorChatTarget && !reapplicationHistoryTarget && !addExistingTutorModalOpen && !isFormControlFocused()){
      render();
    }
  }, err => console.error('Bookings listener error:', err));
}
function stopBookingsPolling(){
  if(bookingsUnsubscribe) bookingsUnsubscribe();
  bookingsUnsubscribe = null;
  bookingsListenerActive = false;
}

// Re-renders while preserving the chat thread's scroll position — only
// snaps back to the bottom if the person was already near the bottom
// (so it doesn't yank them down while they're reading older messages).
// Also restores input focus/cursor so typing doesn't get interrupted.
function renderPreservingChatScroll(){
  const before = document.getElementById('chatThread');
  const wasNearBottom = !before || (before.scrollHeight - before.scrollTop - before.clientHeight < 60);
  const prevScrollTop = before ? before.scrollTop : 0;

  const inputBefore = document.getElementById('chatInput');
  const hadFocus = !!inputBefore && document.activeElement === inputBefore;
  const cursorPos = inputBefore ? inputBefore.selectionStart : null;

  render();

  const after = document.getElementById('chatThread');
  if(after){
    after.scrollTop = wasNearBottom ? after.scrollHeight : prevScrollTop;
  }

  if(hadFocus){
    const inputAfter = document.getElementById('chatInput');
    if(inputAfter){
      inputAfter.focus();
      if(cursorPos != null){
        try{ inputAfter.setSelectionRange(cursorPos, cursorPos); }catch(e){}
      }
    }
  }
}
// Same idea, but skips the re-render entirely while the chat input is
// mid-IME-composition (see the comment on chatInputComposing above) —
// restoring focus/cursor after the fact isn't enough, since rebuilding the
// DOM node itself resets the browser's in-progress composition buffer.
function renderPreservingChatScrollUnlessComposing(){
  if(chatInputComposing){
    chatInputRerenderPending = true;
    return;
  }
  renderPreservingChatScroll();
}
// Wires compositionstart/compositionend tracking onto a chat text input, and
// flushes any update that arrived (and was deferred) during composition.
function wireChatComposition(inputEl){
  if(!inputEl) return;
  inputEl.addEventListener('compositionstart', () => { chatInputComposing = true; });
  inputEl.addEventListener('compositionend', () => {
    chatInputComposing = false;
    if(chatInputRerenderPending){
      chatInputRerenderPending = false;
      renderPreservingChatScroll();
    }
  });
}


/* ============================================================

   ============================================================ */
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function isWeekday(d){ const day=d.getDay(); return day>=1 && day<=5; }
function upcomingWeekdays(count){
  const out=[]; let cur=new Date(); cur.setHours(0,0,0,0); cur.setDate(cur.getDate()+1);
  while(out.length < count){
    if(isWeekday(cur)) out.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
// Same idea as upcomingWeekdays, but includes every day (2nd Demo can be
// scheduled on any day, not just weekdays like the 1st Demo booking slots).
function upcomingDays(count){
  const out=[]; let cur=new Date(); cur.setHours(0,0,0,0);
  for(let i=0;i<count;i++){ out.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  return out;
}
function mondayOf(date){
  const d = new Date(date); d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = (day===0 ? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d;
}
function firstBookableMonday(){
  const tomorrow = new Date(); tomorrow.setHours(0,0,0,0); tomorrow.setDate(tomorrow.getDate()+1);
  return mondayOf(tomorrow);
}
function isDateClosed(dateStr){
  return config && config.closedDates && config.closedDates.includes(dateStr);
}
function slotsUsed(date, time){
  // Admin has the full bookings collection loaded locally (via
  // loadBookings()/the real-time listener), so compute directly from that —
  // it's already there and more precise. Applicants/tutors never load the
  // full collection anymore (see the Cloud Functions notes above), so they
  // read the aggregate counts fetched via getSlotAvailability() instead.
  if(view === 'admin'){
    return bookings.filter(b => b.date===date && b.time===time).length;
  }
  return slotCounts[date + '_' + time] || 0;
}
function dowOfDateStr(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y, m-1, d).getDay();
}
function slotCapacityFor(dateStr, time){
  const dow = dowOfDateStr(dateStr);
  const dayMap = config && config.slotCapacity && config.slotCapacity[dow];
  return (dayMap && dayMap[time] != null) ? dayMap[time] : 1;
}
function dateFull(dateStr){
  return SLOTS.every(s => slotsUsed(dateStr, s.time) >= slotCapacityFor(dateStr, s.time));
}
function dateRemainingCount(dateStr){
  return SLOTS.reduce((sum,s)=> sum + Math.max(0, slotCapacityFor(dateStr, s.time)-slotsUsed(dateStr,s.time)), 0);
}
function fmtDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${MONTHS_SHORT[m-1]} ${d} (${DOW[dt.getDay()]})`;
}
// Used for booking IDs specifically — once Firestore rules stop allowing
// public "list" queries on the bookings collection (only "get by exact ID"
// stays open to non-admins), the ID itself becomes the only thing standing
// between a random visitor and someone else's booking, so it needs to be
// genuinely hard to guess, not just "probably unique". crypto.randomUUID()
// gives 122 bits of randomness — Date.now() + a short Math.random() suffix
// (the old scheme) does not.
function generateSecureId(prefix){
  if(typeof crypto !== 'undefined' && crypto.randomUUID) return prefix + '_' + crypto.randomUUID();
  // Fallback for any environment without crypto.randomUUID — still far
  // stronger than the old timestamp+short-suffix scheme.
  const bytes = new Uint8Array(16);
  if(typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for(let i=0;i<16;i++) bytes[i] = Math.floor(Math.random()*256);
  return prefix + '_' + Array.from(bytes).map(b => b.toString(16).padStart(2,'0')).join('');
}

// In-browser voice recording for 'audio' type fields. Keyed by
// formKey+fieldId so multiple recorder widgets on the same page (e.g.
// across forms) never interfere with each other.
//
// Captures raw PCM samples directly via the Web Audio API as they're
// spoken, instead of recording through MediaRecorder into a webm/mp4
// container and decoding that back afterward. That record-then-decode
// round trip was the actual cause of the silent-output bug: Chrome's
// MediaRecorder containers (especially a single large chunk with no
// timeslice) don't reliably carry proper duration/track metadata, and
// decodeAudioData can "succeed" on them while producing empty or corrupted
// audio data — which then encodes into a technically-valid but silent MP3.
// Capturing the samples directly sidesteps that decode step entirely.
const audioRecorderState = {};

function encodeFloat32ToMp3(float32Samples, sampleRate){
  const int16Samples = new Int16Array(float32Samples.length);
  for(let i = 0; i < float32Samples.length; i++){
    const s = Math.max(-1, Math.min(1, float32Samples[i]));
    int16Samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const mp3Encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
  const sampleBlockSize = 1152; // multiple of 576, as lamejs expects
  const mp3Chunks = [];
  for(let i = 0; i < int16Samples.length; i += sampleBlockSize){
    const chunk = int16Samples.subarray(i, i + sampleBlockSize);
    const buf = mp3Encoder.encodeBuffer(chunk);
    if(buf.length > 0) mp3Chunks.push(buf);
  }
  const finalChunk = mp3Encoder.flush();
  if(finalChunk.length > 0) mp3Chunks.push(finalChunk);
  return new Blob(mp3Chunks, { type: 'audio/mpeg' });
}

async function startAudioRecording(formKey, fieldId, onDone){
  const key = `${formKey}_${fieldId}`;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    const source = audioCtx.createMediaStreamSource(stream);
    // ScriptProcessorNode is deprecated but still fully functional in every
    // current browser, and is far simpler to inline in a single HTML file
    // than AudioWorklet (which needs a separate module file/URL).
    const processor = audioCtx.createScriptProcessor(4096, 1, 1);
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0; // keep the graph active without echoing the mic back to the speakers
    const samples = [];

    processor.onaudioprocess = (e) => {
      samples.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };
    source.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioCtx.destination);

    audioRecorderState[key] = { stream, audioCtx, source, processor, silentGain, samples, onDone };
    return true;
  }catch(e){
    console.error('Microphone access error:', e);
    return false;
  }
}
function stopAudioRecording(formKey, fieldId){
  const key = `${formKey}_${fieldId}`;
  const rec = audioRecorderState[key];
  if(!rec) return;
  rec.processor.disconnect();
  rec.source.disconnect();
  rec.silentGain.disconnect();
  rec.stream.getTracks().forEach(t => t.stop());
  const sampleRate = rec.audioCtx.sampleRate;
  const totalLength = rec.samples.reduce((sum, arr) => sum + arr.length, 0);
  const combined = new Float32Array(totalLength);
  let offset = 0;
  for(const arr of rec.samples){ combined.set(arr, offset); offset += arr.length; }
  rec.audioCtx.close();
  const onDone = rec.onDone;
  delete audioRecorderState[key];

  try{
    const mp3Blob = encodeFloat32ToMp3(combined, sampleRate);
    onDone(mp3Blob, true);
  }catch(e){
    console.error('MP3 encoding failed:', e);
    onDone(null, false);
  }
}
// Wires up the record/stop/upload/re-record controls for one 'audio' field.
// Shared across the Apply/Signup/Device forms so the MediaRecorder logic
// only needs to live in one place.
function wireAudioField(formKey, field, state, render){
  const startBtn = document.querySelector(`[data-audio-start="${field.id}"]`);
  const stopBtn = document.querySelector(`[data-audio-stop="${field.id}"]`);
  const statusEl = document.querySelector(`[data-audio-status="${field.id}"]`);
  const uploadInput = document.querySelector(`[data-audio-upload="${field.id}"]`);
  const rerecordBtn = document.querySelector(`[data-audio-rerecord="${field.id}"]`);
  const clearBtn = document.querySelector(`[data-audio-clear="${field.id}"]`);

  const setFile = (file) => {
    state.files[field.id] = file;
    state.files[field.id+'Name'] = file ? file.name : '';
    if(!state.filePreviews) state.filePreviews = {};
    if(state.filePreviews[field.id]) URL.revokeObjectURL(state.filePreviews[field.id]);
    state.filePreviews[field.id] = file ? URL.createObjectURL(file) : null;
    render();
  };

  if(startBtn) startBtn.onclick = async () => {
    if(statusEl) statusEl.textContent = 'Requesting microphone access…';
    const ok = await startAudioRecording(formKey, field.id, (blob, success) => {
      if(!success || !blob){
        if(statusEl) statusEl.textContent = "Couldn't process that recording — please try again, or upload a file instead.";
        return;
      }
      const file = new File([blob], `recording_${Date.now()}.mp3`, { type: 'audio/mpeg' });
      setFile(file);
    });
    if(ok){
      startBtn.style.display = 'none';
      if(stopBtn) stopBtn.style.display = '';
      if(statusEl) statusEl.textContent = '🔴 Recording…';
    } else if(statusEl){
      statusEl.textContent = "Couldn't access the microphone — please allow access, or upload a file instead.";
    }
  };
  if(stopBtn) stopBtn.onclick = () => {
    stopAudioRecording(formKey, field.id);
    stopBtn.style.display = 'none';
    if(startBtn) startBtn.style.display = '';
    if(statusEl) statusEl.textContent = 'Encoding to MP3…';
  };
  if(uploadInput) uploadInput.onchange = e => { setFile(e.target.files[0] || null); };
  if(rerecordBtn) rerecordBtn.onclick = () => { setFile(null); };
  if(clearBtn) clearBtn.onclick = () => { setFile(null); };
}
