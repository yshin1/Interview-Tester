// Exports a list of dynamic-form submissions to a downloadable .xlsx file,
// using the CURRENT schema's field labels as column headers so the sheet
// reads the same way the live form does. Runs entirely client-side (SheetJS).
function exportSubmissionsToExcel(records, schema, filenamePrefix){
  if(typeof XLSX === 'undefined'){
    alert("Couldn't load the Excel export library — check your internet connection and try again.");
    return;
  }
  const fields = (schema || []).filter(f => !['section','image','notice'].includes(f.type));
  const usedHeaders = {};
  const headerFor = (field) => {
    let base = (field.label || field.id || 'Field').replace(/\s+/g, ' ').trim() || field.id;
    let header = base;
    let n = 2;
    while(usedHeaders[header]){ header = `${base} (${n})`; n++; }
    usedHeaders[header] = true;
    return header;
  };
  const fieldHeaders = fields.map(f => ({ field: f, header: headerFor(f) }));
  const sorted = [...records].sort((a,b) => new Date(a.submittedAt||0) - new Date(b.submittedAt||0));
  const rows = sorted.map(r => {
    const row = {};
    fieldHeaders.forEach(({field, header}) => {
      let val;
      if(field.type === 'file' || field.type === 'audio'){
        val = r[field.id+'Url'] || '';
      } else if(field.type === 'checkbox'){
        val = r[field.id] ? 'Yes' : 'No';
      } else {
        val = r[field.id];
      }
      row[header] = (val === undefined || val === null) ? '' : val;
    });
    row['Submitted At'] = r.submittedAt ? new Date(r.submittedAt).toLocaleString('en-US') : '';
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Submissions');
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `${filenamePrefix}_${dateStr}.xlsx`);
}

function showNotionSelectOverlay(rows){
  // Renders a REAL, visible HTML table and selects its contents using the browser's
  // native Selection API — not a scripted clipboard write. The person then presses
  // Ctrl+C themselves, which is the same mechanism as copying a table off any website
  // into Excel/Notion. This sidesteps clipboard-permission issues entirely, because the
  // actual copy step is a native, user-initiated browser action.
  const existing = document.getElementById('notionSelectOverlay');

  sub.textContent = 'Then close this box and paste into a new row in Notion (select the whole row first, not the Contact Date cell).';

  const table = document.createElement('table');
  table.id = 'notionSelectTable';
  table.style.cssText = 'border-collapse:collapse; width:100%; font-size:12.5px;';
  rows.forEach(b => {
    const tr = document.createElement('tr');
    notionRowFields(b).forEach(val => {
      const td = document.createElement('td');
      td.style.cssText = 'border:1px solid #DADFE6; padding:6px 10px; white-space:nowrap;';
      td.textContent = val;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  card.appendChild(table);

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close';
  closeBtn.style.cssText = 'margin-top:16px; padding:10px 20px; border-radius:9px; border:1.5px solid #DADFE6; background:transparent; font-family:inherit; font-size:13.5px; cursor:pointer;';
  closeBtn.onclick = () => overlay.remove();
  card.appendChild(closeBtn);

  overlay.appendChild(card);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);

  // Select the table's full contents automatically.
  try{
    const range = document.createRange();
    range.selectNodeContents(table);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(e){ /* if selection fails, the person can still manually drag-select the visible table */ }
}

// Resizes/compresses an uploaded image file entirely in the browser (canvas),
// since we store these as base64 in Firestore rather than Firebase Storage.
// Keeps documents small and avoids needing the paid Blaze plan.
function compressImageFile(file, maxWidth = 900, quality = 0.82){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read that as an image.'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let dynamicFormState = {
  apply: { answers:{}, files:{}, filePreviews:{}, error:'', busy:false, done:false, draftPromptDismissed:false },
  device: { answers:{}, files:{}, filePreviews:{}, error:'', busy:false, done:false, draftPromptDismissed:false },

// Auto-saves text answers as the person types, so a refresh or accidentally
// closed tab doesn't lose everything — files/recordings can't be persisted
// this way (browsers won't let a site re-read a File object across a
// reload), so the person re-attaches those, but the text side survives.
// Wrapped in try/catch since localStorage can throw (private browsing,
// storage disabled, quota) — a failed autosave should never break the form.
const FORM_DRAFT_KEY_PREFIX = 'langdy_form_draft_';
function saveFormDraft(formKey){
  try{
    const state = dynamicFormState[formKey];
    const hasAnyAnswer = Object.values(state.answers).some(v => v !== '' && v != null && v !== false);
    if(!hasAnyAnswer){
      localStorage.removeItem(FORM_DRAFT_KEY_PREFIX + formKey);
      return;
    }
    localStorage.setItem(FORM_DRAFT_KEY_PREFIX + formKey, JSON.stringify({ answers: state.answers, savedAt: new Date().toISOString() }));
  }catch(e){ /* ignore — autosave is a nicety, not a requirement */ }
}
function loadFormDraft(formKey){
  try{
    const raw = localStorage.getItem(FORM_DRAFT_KEY_PREFIX + formKey);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed.answers !== 'object') return null;
    return parsed;
  }catch(e){ return null; }
}
function clearFormDraft(formKey){
  try{ localStorage.removeItem(FORM_DRAFT_KEY_PREFIX + formKey); }catch(e){ /* ignore */ }
}
// Shown above a form when a saved draft exists and the person hasn't yet
// typed anything in THIS session — lets them pick up where they left off
// instead of silently losing everything to a refresh or closed tab.
function renderDraftRestoreBanner(formKey){
  const state = dynamicFormState[formKey];
  if(state.draftPromptDismissed) return '';
  const hasStartedTyping = Object.values(state.answers).some(v => v !== '' && v != null && v !== false);
  if(hasStartedTyping) return '';
  const draft = loadFormDraft(formKey);
  if(!draft) return '';
  const savedDate = draft.savedAt ? new Date(draft.savedAt) : null;
  const savedLabel = savedDate ? savedDate.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  return `
  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 18px; margin-bottom:20px; border-radius:12px; background:rgba(199,154,59,0.10); border:1.5px solid rgba(199,154,59,0.4);">
    <div>
      <div style="font-size:13.5px; font-weight:700;">You have unfinished answers from before${savedLabel ? ` (${savedLabel})` : ''}</div>
      <div style="font-size:12px; color:var(--slate-light); margin-top:2px;">Files and recordings couldn't be saved and will need to be re-attached.</div>
    </div>
    <div style="display:flex; gap:8px; flex-shrink:0;">
      <button type="button" class="btn btn-ghost btn-sm" id="draftDismissBtn_${formKey}" style="width:auto; padding:9px 14px;">Start Fresh</button>
      <button type="button" class="btn btn-gold btn-sm" id="draftRestoreBtn_${formKey}" style="width:auto; padding:9px 16px;">Continue Where I Left Off</button>
    </div>
  </div>`;
}

let chatDraftText = '';
// Holds a file the person has attached but not yet sent — staged so they
// can see the filename and remove it before it actually uploads, instead of
// the old behavior of uploading and sending the instant a file was picked.
let chatStagedFile = null;
// True while the browser's IME is mid-composition (e.g. building up a
// Korean syllable block one jamo at a time). A real-time chat update
// arriving mid-composition used to trigger a full re-render that replaced
// the input DOM node, which resets the IME's composition state and left
// the jamo unmerged (e.g. "니가" showing as "ㄴㅣㄱㅏ"). Deferring the
// re-render until composition ends avoids interrupting it.
let chatInputComposing = false;
let chatInputRerenderPending = false;

// Browser notifications for new chat messages only — no server push, no
// Cloud Functions, just the standard Notification API. Works as long as a
// tab with this site is open somewhere (even unfocused or in the
// background); does NOT fire if the site/browser is fully closed.
let chatNotificationPermission = (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported';
// Browser permission can only ever be granted or revoked by the person
// through their browser's own settings — a site can never programmatically
// turn it back off. So "Turn Off" here just mutes our own use of it, kept
// separate from the underlying (one-way) browser permission.
let chatNotificationsEnabled = true;
// Tracks the last-seen message count per booking, so an incoming real-time
// update can tell "N new messages just got added" apart from any other
// change to the document — used purely to decide when to fire a
// notification. Used on the applicant/tutor's own chat view, where the full
// subcollection-sourced messages array for that one conversation is already
// available locally.
let chatKnownMessageCounts = {};
// Same idea, but for admin's collection-wide notification detection across
// EVERY booking at once — driven by the lastMessageAt summary field instead
// of message counts, since reading every booking's full messages
// subcollection just to detect "did something change" would defeat the
// point of moving messages out of the booking document in the first place.
let chatKnownLastMessageAt = {};
// Guards subscribeToPushNotifications() from being re-attempted on every
// single re-render of the chat view within one page session — once per
// booking per load is enough.
let pushAutoResubscribeAttempted = {};
async function requestChatNotificationPermission(){
  if(typeof Notification === 'undefined') return;
  try{
    chatNotificationPermission = await Notification.requestPermission();
  }catch(e){
    console.error('Notification permission request failed:', e);
  }
  render();
}
// Shows a browser notification for an incoming chat message, unless the
// person is already actively looking at that exact chat with the tab
// focused (in which case they'll see it appear live anyway).
//
// currentlyOpenBookingId is optional. Admin has many possible
// conversations, so it passes whichever chat modal (if any) is currently
// open, to compare against. An applicant/tutor only ever has ONE possible
// conversation — their own — so there's nothing meaningful to compare
// against; the call site there omits this argument, and "already looking
// at it" reduces to just "is the tab actually focused right now".
function maybeShowChatNotification(senderName, messageText, bookingId, currentlyOpenBookingId){
  if(typeof Notification === 'undefined' || chatNotificationPermission !== 'granted' || !chatNotificationsEnabled) return;
  const tabActivelyFocused = document.visibilityState === 'visible' && document.hasFocus();
  const alreadyLookingAtIt = currentlyOpenBookingId === undefined
    ? tabActivelyFocused
    : (tabActivelyFocused && currentlyOpenBookingId === bookingId);
  if(alreadyLookingAtIt) return;
  try{
    // The tag includes a timestamp so every notification is treated as
    // genuinely new — a fixed tag like just 'chat-'+bookingId meant a
    // SECOND message in the same conversation could get silently coalesced
    // into the first (no fresh popup, sometimes no popup at all) instead of
    // showing on its own.
    const notif = new Notification(senderName, { body: messageText || '📎 Sent a file', tag: 'chat-'+bookingId+'-'+Date.now() });
    notif.onclick = () => { window.focus(); notif.close(); };
  }catch(e){
    console.error('Failed to show notification:', e);
  }
}
// --- Web Push (real, closed-app notifications) -----------------------------
//
// The Notification calls above only fire while a tab with this site is open
// somewhere (even backgrounded) — they can't reach someone whose phone
// browser is fully closed. Web Push closes that gap: a service worker
// (sw.js) registered once can receive a push message and show a
// notification even with no tab open at all. On Android/desktop this works
// straight from a normal browser tab; on iPhone, Apple only allows it for a
// site that's been added to the Home Screen and opened from that icon (see
// the "add to Home Screen" banner rendered elsewhere) — a plain Safari tab
// can never receive push on iOS, no exceptions.
//
// The public key below is exactly that — public. Only the matching PRIVATE
// key (kept server-side as a Firebase secret, see functions/index.js) can
// actually sign a push message this key will accept, so embedding this in
// client code is safe by design.
const VAPID_PUBLIC_KEY = 'BNqFVmOEkKwh0J2i4oLL361lhM6xPdR3axkew1yGr3xoxMJw6nu0I-vgpidHIoDKE0Nd7cptZ62kbfFq8rsPGDY';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
// Small, deterministic hash of the subscription's endpoint URL, used as the
// Firestore document ID — re-subscribing on the same device/browser then
// just overwrites the same record instead of piling up duplicates every
// time this runs (e.g. on every page load).
function hashString(str){
  let hash = 0;
  for(let i=0; i<str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}
// Registered unconditionally, as early as possible, independent of the
// booking/notification flow below — this is what makes Chrome treat the
// site as a real installable app (proper "Install app" prompt) rather than
// only offering the plain bookmark-style "Add to Home Screen" shortcut,
// which doesn't require a service worker at all. Previously this only ran
// inside subscribeToPushNotifications(), so anyone who hadn't finished a
// booking and turned on notifications yet had no service worker running,
// and installability was never detected for them.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(e => console.error('SW registration failed:', e));
}

// Registers the service worker (idempotent — a no-op if already registered)
// and subscribes this device/browser to Web Push, saving the subscription
// under the given booking so the sendPushOnAdminMessage Cloud Function
// knows where to deliver a push when admin sends a new message. Silently
// does nothing wherever Push isn't supported (older browsers, or an iPhone
// still in a regular Safari tab rather than installed) — the in-page
// Notification system above still covers those cases while the tab is open.
async function subscribeToPushNotifications(bookingId){
  if(!bookingId) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    if(!subJson.endpoint || !subJson.keys) return;
    const subId = 'sub_' + hashString(subJson.endpoint);
    await db.collection(BOOKINGS_COLLECTION).doc(bookingId).collection('pushSubscriptions').doc(subId).set({
      endpoint: subJson.endpoint,
      keys: subJson.keys,
      userAgent: (navigator.userAgent||'').slice(0,200),
      createdAt: new Date().toISOString()
    });
  }catch(e){
    console.error('Push subscription failed:', e);
  }
}
// True for an iPhone/iPad currently viewing the site as a plain Safari tab
// (not installed) — the one case where push is possible in principle but
// blocked purely by "not installed to Home Screen yet", worth a specific
// nudge rather than just silently not working.
function isIOSNotStandalone(){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true
    || (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches);
  return isIOS && !isStandalone;
}
function isAndroidNotStandalone(){
  const isAndroid = /Android/.test(navigator.userAgent);
  const isStandalone = typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches;
  return isAndroid && !isStandalone;
}
function isDesktopNotStandalone(){
  const isMobile = /iPad|iPhone|iPod|Android/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.navigator.standalone === true
    || (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches);
  return !isMobile && !isStandalone;
}
// Same small, unobtrusive box either way — only shows on a phone that
// hasn't installed the site yet, and says nothing to anyone else (desktop,
// or already-installed). Keeps this out of the main page layout entirely

// Shared click handler for both the small toggle and the big banner button —
// requests permission the first time, and just flips the mute flag on
// every subsequent click since permission itself can't be re-requested or
// revoked programmatically once granted. bookingId is only meaningful for
// the applicant/tutor's own chat (there's exactly one possible
// conversation to subscribe to); admin's usage omits it, since push
// delivery here is specifically for admin's messages reaching the
// applicant/tutor, not the other direction.
// The other half of subscribeToPushNotifications — removes this device's
// push subscription doc so sendPushOnAdminMessage has nothing left to send
// to. Deliberately doesn't call the browser's sub.unsubscribe() itself:
// this device might share the same underlying PushSubscription across
// other bookings if there were any, and deleting our own Firestore
// record is sufficient to stop delivery for THIS booking specifically.
async function unsubscribeFromPushNotifications(bookingId){
  if(!bookingId) return;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    const subJson = sub.toJSON();
    if(!subJson.endpoint) return;
    const subId = 'sub_' + hashString(subJson.endpoint);
    await db.collection(BOOKINGS_COLLECTION).doc(bookingId).collection('pushSubscriptions').doc(subId).delete();
  }catch(e){
    console.error('Push unsubscribe failed:', e);
  }
}
// Admin's side of the same Web Push setup — not scoped to any one booking
// (admin has many conversations, not just one), so subscriptions live in
// their own top-level collection instead of a booking's subcollection.
// Delivers via sendPushOnApplicantMessage whenever an applicant/tutor
// sends a message, same reasoning as the applicant/tutor side: reaches
// admin even with no tab open at all.
async function subscribeToAdminPushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    if(!subJson.endpoint || !subJson.keys) return;
    const subId = 'sub_' + hashString(subJson.endpoint);
    await db.collection('adminPushSubscriptions').doc(subId).set({
      endpoint: subJson.endpoint,
      keys: subJson.keys,
      userAgent: (navigator.userAgent||'').slice(0,200),
      createdAt: new Date().toISOString()
    });
  }catch(e){
    console.error('Admin push subscription failed:', e);
  }
}
async function unsubscribeFromAdminPushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub) return;
    const subJson = sub.toJSON();
    if(!subJson.endpoint) return;
    const subId = 'sub_' + hashString(subJson.endpoint);
    await db.collection('adminPushSubscriptions').doc(subId).delete();
  }catch(e){
    console.error('Admin push unsubscribe failed:', e);
  }
}
// Reflects whatever this device's actual subscription state is into the
// "on/off" label the first time admin views a chat each session — without
// this, chatNotificationsEnabled would just default to true on every
// reload regardless of whether a subscription doc actually exists.
let adminPushSyncAttempted = false;
async function syncAdminPushToggleState(){
  if(adminPushSyncAttempted) return;
  adminPushSyncAttempted = true;
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(!sub){ chatNotificationsEnabled = false; render(); return; }
    const subJson = sub.toJSON();
    if(!subJson.endpoint){ chatNotificationsEnabled = false; render(); return; }
    const subId = 'sub_' + hashString(subJson.endpoint);
    const doc = await db.collection('adminPushSubscriptions').doc(subId).get();
    chatNotificationsEnabled = doc.exists;
    render();
  }catch(e){
    console.error('Admin push sync failed:', e);
  }
}
async function toggleChatNotifications(bookingId){
  const isAdminContext = !bookingId && !!currentAdminUser;
  if(chatNotificationPermission !== 'granted'){
    await requestChatNotificationPermission();
    chatNotificationsEnabled = true;
    if(chatNotificationPermission === 'granted'){
      if(bookingId){
        await subscribeToPushNotifications(bookingId);
        await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({ pushDisabled: false }).catch(()=>{});
      } else if(isAdminContext){
        await subscribeToAdminPushNotifications();
      }
    }
    render();
  } else {
    // "Off" used to only hide the in-page banner while the tab was open —
    // the actual push subscription in Firestore stayed active the whole
    // time, so background notifications kept arriving regardless. It also
    // wasn't saved anywhere, so a page reload silently turned notifications
    // back "on" too. Both are fixed by actually removing the subscription
    // (see unsubscribeFromPushNotifications) and persisting the choice
    // rather than only in this in-memory flag.
    const turningOff = chatNotificationsEnabled;
    chatNotificationsEnabled = !chatNotificationsEnabled;
    render();
    if(bookingId){
      if(turningOff){
        await unsubscribeFromPushNotifications(bookingId);
        await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({ pushDisabled: true }).catch(()=>{});
      } else {
        await subscribeToPushNotifications(bookingId);
        await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({ pushDisabled: false }).catch(()=>{});
      }
    } else if(isAdminContext){
      if(turningOff) await unsubscribeFromAdminPushNotifications();
      else await subscribeToAdminPushNotifications();
    }
  }
}
// Flips whether push notifications for this booking play sound/vibrate —
// stored on the booking doc (not just locally) since sw.js reads it via
// the push payload built server-side, and needs the preference to still
// apply even when this tab/app isn't open to hold it in memory.
async function toggleChatNotificationSilent(bookingId){
  if(!bookingId) return;
  const b = bookings.find(x => x.id === bookingId);
  const next = !(b && b.pushMuted);
  await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({ pushMuted: next });
  const idx = bookings.findIndex(x => x.id === bookingId);
  if(idx !== -1) bookings[idx] = Object.assign({}, bookings[idx], { pushMuted: next });
  render();
}
// Binds every possible notification control (the big banner button and the
// small inline toggle, in whichever state each currently renders) to the
// same handler — call this once per render wherever either might appear.
function wireChatNotificationControls(bookingId){
  ['chatEnableNotifsBtn','chatMuteNotifsBtn','chatUnmuteNotifsBtn','chatNotifBannerToggle'].forEach(id => {
    const el = document.getElementById(id);

  }
}

function findTabGroup(tab){

    if(g.children && g.children.some(([k])=>k===tab)) return g;
  }
  return TAB_GROUPS[0];
}
function isValidAdminTabKey(key){
  return TAB_GROUPS.some(g => g.tab === key || (g.children && g.children.some(([k]) => k === key)));

// Keeps the URL in sync with whichever admin tab is showing — lets the
// browser's own back/forward buttons step through tab history, and makes
// a specific tab bookmarkable/shareable instead of every tab looking like
// the same bare ?admin link.
function syncAdminTabUrl(){
  const url = new URL(window.location.href);

function unreadCountForTabKey(key){
  if(key === 'chats'){
    return bookings.filter(b => lastMessageInfo(b) !== null).reduce((sum,b) => sum + unreadCountForAdmin(b), 0);
  }
  if(key === 'tutorChats'){
    return bookings.filter(b => b.tutorAccountCreated === true && !isFormerTutor(b)).reduce((sum,b) => sum + unreadCountForAdmin(b), 0);
  }
  if(key === 'resignedTutors'){
    return bookings.filter(b => b.tutorAccountCreated === true && b.tutorEmploymentStatus === 'resigned').reduce((sum,b) => sum + unreadCountForAdmin(b), 0);
  }
  if(key === 'terminatedTutors'){
    return bookings.filter(b => b.tutorAccountCreated === true && b.tutorEmploymentStatus === 'terminated').reduce((sum,b) => sum + unreadCountForAdmin(b), 0);
  }
  return 0;
}
// Counts records not yet opened by admin, per tab — same idea as the
// unread-message counts above, but for "NEW" applications/bookings/signups/
// device submissions rather than chat messages.
function newCountForTabKey(key){
  const isNew = r => r.viewedByAdmin === false;
  if(key === 'applications') return applications.filter(a => !isArchivedApplication(a) && !hasMovedOnFromApplication(a) && isNew(a)).length;
  if(key === 'list') return bookings.filter(b => b.demoResult !== 'pass' && isNew(b)).length;
  // Excludes bookings that already have a 2nd demo result — once a decision
  // is made they've effectively moved on to onboarding, so they shouldn't
  // keep counting as "new" here even in the rare case viewedByAdmin never
  // got set (e.g. admin only ever used the quick result dropdown).
  if(key === 'secondDemo') return bookings.filter(b => b.demoResult === 'pass' && !b.secondDemoResult && isNew(b)).length;
  if(key === 'accountSignups') return accountSignups.filter(isNew).length;
  if(key === 'deviceSubmissions') return deviceSubmissions.filter(isNew).length;
  return 0;
}

function monthMatrix(year, month){
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

    ).join('');
    const secondChips = secondDemoBookings.slice(0, Math.max(0,CHIP_CAP-firstDemoBookings.length)).map(b=>
      `<span class="cal-chip" data-2nd-schedule-id="${b.id}" style="background:var(--gold-bg); border-color:var(--gold-dark);" title="2nd Demo — ${escapeHtml(b.fullName)} ${b.secondDemoTime||''} KST">🅱 ${b.secondDemoTime||'?'} ${escapeHtml(b.fullName)}</span>`
    ).join('');
    const shown = Math.min(firstDemoBookings.length, CHIP_CAP) + Math.min(secondDemoBookings.length, Math.max(0,CHIP_CAP-firstDemoBookings.length));
    const more = total > shown
      ? `<div class="cal-more" data-day-detail="${ds}" style="font-size:10px; color:var(--navy); font-weight:700; cursor:pointer; margin-top:2px;">+${total-shown} more</div>`
      : '';

    return `<div class="cal-cell ${weekend?'weekend':''} ${closed?'is-closed':''}">
      <div class="dnum"><span>${d}</span>${closed?'<span class="closed-tag">Closed</span>':''}</div>

    </div>`;
  }).join('');

  // Mobile-only alternative to the grid above — a 7-column month grid has
  // no room left for a name once you're down to phone width, so this is a
  // plain vertical list instead: one row per day, tap a day with bookings
  // to open the same day-detail modal the grid's "+N more" already uses.
  const mobileListHtml = cells.filter(d => d !== null).map(d => {
    const dt = new Date(year, month, d);
    const ds = fmtDate(dt);
    const weekend = dt.getDay()===0 || dt.getDay()===6;
    const closed = isDateClosed(ds);
    const firstCount = calShowFirstDemo ? bookings.filter(b=>b.date===ds).length : 0;
    const secondCount = calShowSecondDemo ? bookings.filter(b=>b.secondDemoDate===ds && b.demoResult==='pass').length : 0;
    const total = firstCount + secondCount;
    const isToday = ds === todayStr;
    const parts = [];
    if(firstCount>0) parts.push(`${firstCount} 1st`);
    if(secondCount>0) parts.push(`${secondCount} 2nd`);
    return `<div class="cal-mobile-row ${weekend?'weekend':''} ${closed?'is-closed':''} ${isToday?'is-today':''}" ${total>0?`data-day-detail="${ds}"`:''}>
      <div class="cal-mobile-date">
        <span class="cal-mobile-daynum">${d}</span>
        <span class="cal-mobile-dow">${DOW[dt.getDay()]}${isToday?' · Today':''}</span>
      </div>
      ${closed ? '<span class="closed-tag">Closed</span>' : total>0 ? `<span class="cal-mobile-count">${parts.join(', ')} ›</span>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="card">
    <div class="cal-header">
      <button class="btn btn-ghost btn-sm" id="calPrev">‹ Prev</button>
      <div class="cal-title">${MONTHS[month]} ${year}</div>
      <button class="btn btn-ghost btn-sm" id="calNext">Next ›</button>
    </div>
    <div style="display:flex; gap:16px; margin:14px 0;">
      <label class="checkbox-item" style="cursor:pointer;"><input type="checkbox" id="calFilterFirst" ${calShowFirstDemo?'checked':''}> 1st Demo</label>
      <label class="checkbox-item" style="cursor:pointer;"><input type="checkbox" id="calFilterSecond" ${calShowSecondDemo?'checked':''}> 2nd Demo <span style="color:var(--slate-light); font-weight:400;">(KST)</span></label>
    </div>
    <div class="cal-grid cal-grid-desktop">${dowHtml}${cellsHtml}</div>
    <div class="cal-mobile-list">${mobileListHtml}</div>
    <p class="cal-grid-desktop" style="font-size:12px; color:var(--slate-light); margin-top:14px;">Click a 1st Demo name to reassign or cancel it. Click a 2nd Demo (🅱) name to open the chat. Click "+N more" to see everyone booked that day.</p>
  </div>
  ${dayDetailTarget ? renderDayDetailModal() : ''}`;
}

function pad2(n){ return String(n).padStart(2,'0'); }
function toUSDate(y,m,d){ return `${pad2(m)}/${pad2(d)}/${y}`; }
function notionRowFields(b){
  const c = new Date(b.bookedAt);
  const contactDateStr = toUSDate(c.getFullYear(), c.getMonth()+1, c.getDate());
  const [dy,dm,dd] = b.date.split('-').map(Number);
  const demoDateStr = toUSDate(dy, dm, dd);
  // Column order matches the Notion "1st Demo" tracker: Contact Date, Stage, 1st Demo P/F, Name, Status, Assign, 1st Demo Date, Time
  return [contactDateStr, '1st Demo', '', b.fullName, 'Not confirmed yet', b.assignedTo||'', demoDateStr, b.time + ' PHT'];
}

function renderAdminApplications(){

      <td class="mobile-hide tag" style="white-space:nowrap;">${submittedDate.toLocaleDateString('en-US')}<br><span style="font-size:10.5px; color:var(--slate-light);">${submittedDate.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })}</span></td>
      <td class="mobile-hide tag">${a.score!=null && a.score!=='' ? a.score+'/10' : '—'}</td>
      <td>
        <span class="td-mobile-label">Result</span>
        <select data-result-app="${a.id}" style="font-size:12.5px; padding:6px 8px; border:1.5px solid var(--line); border-radius:7px; font-family:inherit;">
          <option value="" ${!a.result?'selected':''}>Pending</option>
          <option value="pass" ${a.result==='pass'?'selected':''}>Pass</option>
          <option value="fail" ${a.result==='fail'?'selected':''}>Fail</option>
        </select>
      </td>
      <td>${invitedCell}</td>
      <td>
        ${(() => { const hist = getReapplicationHistory(a.email, a.id); return hist.length > 0

          : ''; })()}

  const selectedCount = [...selectedApplicationIds].filter(id => sorted.some(a=>a.id===id)).length;

  return `
  <div class="card">
    ${shareLinkBox}
    <button class="btn btn-ghost btn-sm" id="exportApplicationsExcelBtn" style="width:auto; padding:9px 16px; margin-bottom:14px;">📊 Export to Excel</button>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <label style="margin:0; white-space:nowrap;">Worked before</label>
      <select id="appFilterWorked" style="max-width:180px; padding:9px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit;">
        <option value="all" ${applicationFilterWorked==='all'?'selected':''}>All (${activeApplications.length})</option>
        <option value="Yes" ${applicationFilterWorked==='Yes'?'selected':''}>Yes (${activeApplications.filter(a=>a.workedBefore==='Yes').length})</option>
        <option value="No" ${applicationFilterWorked==='No'?'selected':''}>No (${activeApplications.filter(a=>a.workedBefore==='No').length})</option>
      </select>
      <label style="margin:0; white-space:nowrap;">Invited</label>
      <select id="appFilterInvited" style="max-width:170px; padding:9px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit;">
        <option value="all" ${applicationFilterInvited==='all'?'selected':''}>All (${activeApplications.length})</option>
        <option value="invited" ${applicationFilterInvited==='invited'?'selected':''}>Invited (${activeApplications.filter(a=>a.invited).length})</option>
        <option value="notInvited" ${applicationFilterInvited==='notInvited'?'selected':''}>Not invited (${activeApplications.filter(a=>!a.invited).length})</option>

    <table class="list-table app-list-table">
      <thead><tr><th></th><th>Applicant</th><th>Submitted</th><th>Score</th><th>Result</th><th>Invited</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

  // Driven by the CURRENT Apply Form schema (not a fixed field list) so this
  // always matches whatever the admin has set up in Form Builder — no risk
  // of a stale hardcoded row silently showing the wrong field's value.
  const fieldsHtml = schema
    .filter(field => field.type !== 'section' && field.type !== 'image' && field.id !== 'fullName' && field.id !== 'email')
    .map(field => {
      const val = a[field.id];
      if(field.type === 'file' || field.type === 'audio'){

let selfIntroTranslations = {}; // signupId -> { status: 'loading'|'done'|'error', text }
function looksAlreadyKorean(text){
  const hangul = (text.match(/[\uac00-\ud7a3]/g) || []).length;
  const meaningful = (text.replace(/\s/g, '') || '').length || 1;
  return (hangul / meaningful) > 0.2;
}
async function translateSelfIntroToKorean(signupId, text){
  if(!text || !text.trim()) return;
  selfIntroTranslations[signupId] = { status: 'loading', text: '' };
  render();
  try{
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ko&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if(!res.ok) throw new Error('translate request failed');
    const data = await res.json();
    const translated = (data[0] || []).map(chunk => chunk[0]).join('');
    selfIntroTranslations[signupId] = { status: 'done', text: translated };
  }catch(e){
    selfIntroTranslations[signupId] = { status: 'error', text: '' };
  }
  render();
}

function renderDeviceSubmissionDetailModal(){
  const s = deviceSubmissions.find(x => x.id === deviceSubmissionDetailTarget) || {};
  const schema = formSchemas.device || DEVICE_FORM_DEFAULT_SCHEMA;
  const row = (label, val) => `<div class="ticket-row"><span class="k">${escapeHtml(label)}</span><span class="v" style="font-weight:600; font-family:inherit; text-align:right; max-width:60%;">${escapeHtml(val||'—')}</span></div>`;
  const linkRow = (label, url) => `<div class="ticket-row"><span class="k">${escapeHtml(label)}</span><span class="v">${url?`<a href="${escapeHtml(url)}" target="_blank" rel="noopener">Open ↗</a>`:'—'}</span></div>`;

  // Driven by the CURRENT Device Form schema (not a fixed field list) — same
  // reasoning as the Application detail view: a hardcoded field list quietly
  // goes stale (or mismatches a field's actual data shape) the moment the
  // form is customized, and errors out instead of just showing "—".
  const fieldsHtml = schema
    .filter(field => field.id !== 'tutorName')
    .map(field => {
      if(field.type === 'section'){
        return `<div class="section-title" style="font-size:13.5px;">${escapeHtml(field.label)}</div>`;
      }
      const val = s[field.id];
      if(field.type === 'audio'){
        const url = s[field.id+'Url'];
        return url ? `
        <div class="field">
          <label>${escapeHtml(field.label)}</label>
          <audio controls src="${escapeHtml(url)}" style="width:100%;"></audio>
        </div>` : `<div class="ticket-row"><span class="k">${escapeHtml(field.label)}</span><span class="v">—</span></div>`;
      }
      if(field.type === 'file'){
        return linkRow(field.label, s[field.id+'Url']);
      }
      const displayVal = Array.isArray(val) ? val.join(', ') : val;
      return row(field.label, displayVal);
    }).join('');

  return `
  <div class="modal-overlay" id="deviceDetailOverlay">
    <div class="modal" style="max-width:520px; max-height:82vh; overflow:auto;">
      <h3>${escapeHtml(s.tutorName)}</h3>
      ${(s.hasPowerStation === 'No' || s.backupInternetType === 'None of the above') ? `
      <div class="warn-box strong" style="margin-bottom:14px;">
        <div class="icon">⚠️</div>
        <div class="txt">${[s.hasPowerStation==='No'?'No backup power source':null, s.backupInternetType==='None of the above'?'No backup internet':null].filter(Boolean).join(' · ')} — may need to follow up.</div>
      </div>` : ''}
      ${fieldsHtml}
      <div class="modal-actions">
        <button class="btn btn-ghost" id="deviceDetailCloseBtn">Close</button>
        <button class="btn btn-primary" id="deviceMarkReviewedBtn">${s.reviewed?'Mark as New':'Mark as Reviewed'}</button>
      </div>
    </div>
  </div>`;
}

// Reads the Notes modal's current DOM state (feedback text, checklist
// answers, guideline rows — including any added/removed/edited rows) into a
// single patch object to save.
function gatherNotesFormData(){
  const textarea = document.getElementById('notesTextarea');
  const notes = textarea ? textarea.value : '';
  const checklistAnswers = {};
  document.querySelectorAll('[data-checklist-idx]').forEach(el => {
    checklistAnswers[el.dataset.checklistIdx] = el.value;
  });
  const guidelineItems = [];
  const tbody = document.getElementById('guidelineTbody');
  if(tbody){
    tbody.querySelectorAll('tr').forEach(row => {
      const pageEl = row.querySelector('[data-guideline-page]');
      const textEl = row.querySelector('[data-guideline-text]');
      const checkedEl = row.querySelector('[data-guideline-mark]:checked');
      guidelineItems.push({
        page: pageEl ? pageEl.value : '',
        text: textEl ? textEl.value : '',
        mark: checkedEl ? checkedEl.dataset.guidelineMark : ''
      });
    });
  }
  return { notes, checklistAnswers, guidelineItems };
}
// Wires up the ✅/❌ checkbox pair within each guideline row so checking one
// unchecks the other, and wires the row's ✕ remove button — done via direct
// DOM manipulation (no render()) so it doesn't disturb any other unsaved
// typing elsewhere in the modal.
function wireGuidelineRow(row){
  row.querySelectorAll('[data-guideline-mark]').forEach(el => {
    el.onchange = () => {
      if(!el.checked) return;
      row.querySelectorAll('[data-guideline-mark]').forEach(sibling => {
        if(sibling !== el) sibling.checked = false;
      });
    };
  });
  const removeBtn = row.querySelector('[data-remove-guideline-row]');
  if(removeBtn) removeBtn.onclick = () => row.remove();
}
function wireGuidelineCheckboxExclusivity(){
  const tbody = document.getElementById('guidelineTbody');
  if(!tbody) return;
  tbody.querySelectorAll('tr').forEach(wireGuidelineRow);
  const addBtn = document.getElementById('addGuidelineRowBtn');
  if(addBtn) addBtn.onclick = () => {
    const tbody2 = document.getElementById('guidelineTbody');
    if(!tbody2) return;
    tbody2.insertAdjacentHTML('beforeend', renderGuidelineRowHtml({page:'', text:'', mark:''}));
    wireGuidelineRow(tbody2.lastElementChild);
  };
}

let chatsFilterUnreadOnly = false;
let chatsFilterStage = 'all'; // 'all' | '1st' | '2nd'
let chatsSearchQuery = '';

function lastMessageInfo(b){
  if(b.lastMessageAt){
    return { from: b.lastMessageFrom, text: b.lastMessageText, at: b.lastMessageAt };
  }
  // Fallback for any pre-migration record that still has an embedded
  // messages array instead of the lastMessage* summary fields.
  const msgs = (b.messages || []).filter(m => m.from !== 'system');
  if(msgs.length === 0) return null;
  return msgs[msgs.length - 1];
}

function chatStageOf(b){
  return b.demoResult === 'pass' ? '2nd' : '1st';
}

function renderAdminChats(){
  const withMsgs = bookings.filter(b => lastMessageInfo(b) !== null);
  let filtered = chatsFilterUnreadOnly ? withMsgs.filter(b => unreadCountForAdmin(b) > 0) : withMsgs;
  if(chatsFilterStage !== 'all') filtered = filtered.filter(b => chatStageOf(b) === chatsFilterStage);
  const q = chatsSearchQuery.trim().toLowerCase();
  if(q) filtered = filtered.filter(b => (b.fullName||'').toLowerCase().includes(q));

  const sorted = [...filtered].sort((a,b) => {
    const ta = new Date(lastMessageInfo(a).at).getTime();
    const tb = new Date(lastMessageInfo(b).at).getTime();
    return tb - ta; // most recent activity first
  });

  const totalUnreadThreads = withMsgs.filter(b => unreadCountForAdmin(b) > 0).length;

  const emptyMessage = q ? 'No conversations match that search.' : chatsFilterUnreadOnly ? 'No unread messages.' : 'No conversations yet.';
  const rows = sorted.length === 0 ? `<tr><td colspan="4" style="padding:24px; text-align:center; color:var(--slate-light);">${emptyMessage}</td></tr>` : sorted.map(b => {
    const last = lastMessageInfo(b);
    const unread = unreadCountForAdmin(b);
    const stage = chatStageOf(b) === '2nd' ? '2nd Demo' : '1st Demo';
    const who = last.from === 'admin' ? 'You' : b.fullName;
    const preview = last.text.length > 60 ? last.text.slice(0,60)+'…' : last.text;
    return `
    <tr data-chat-id="${b.id}" style="cursor:pointer;">
      <td><strong>${escapeHtml(b.fullName)}</strong><br><span style="color:var(--slate-light); font-size:11px;">${stage}</span></td>
      <td style="max-width:340px;">
        <span style="font-weight:${unread>0?'700':'400'};">${escapeHtml(who)}:</span>
        <span style="color:${unread>0?'var(--ink)':'var(--slate)'};">${escapeHtml(preview)}</span>
      </td>
      <td class="tag">${new Date(last.at).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</td>
      <td>${unread>0 ? `<span class="unread-badge">${unread}</span>` : ''}</td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
      <input type="text" id="chatsSearchInput" placeholder="Search by name…" value="${escapeHtml(chatsSearchQuery)}" style="flex:1; min-width:220px; padding:10px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit;">
      <select id="chatsStageFilterSelect" style="padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit;">
        <option value="all" ${chatsFilterStage==='all'?'selected':''}>All stages</option>
        <option value="1st" ${chatsFilterStage==='1st'?'selected':''}>1st Demo</option>
        <option value="2nd" ${chatsFilterStage==='2nd'?'selected':''}>2nd Demo</option>
      </select>
      <label class="checkbox-item" style="cursor:pointer; white-space:nowrap;">

    <table class="list-table chat-list-table">
      <thead><tr><th>Applicant</th><th>Last Message</th><th>When</th><th>Unread</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;

function isFormerTutor(b){
  return b.tutorEmploymentStatus === 'resigned' || b.tutorEmploymentStatus === 'terminated';
}

// True for any booking that's landed in the Archive tab — failed either demo
// stage, or a tutor who resigned/was terminated. Used to let someone with a
// past, concluded booking re-apply and re-book this cycle under the same
// email, while still blocking a genuine duplicate of an active/in-progress
// booking.
function isArchivedBooking(b){
  return b.demoResult === 'fail' || b.secondDemoResult === 'fail' || isFormerTutor(b);
}

// True for an application marked as failed at the application-review stage
// itself (before ever booking a demo). Lets someone whose application didn't
// go anywhere re-apply next cycle under the same email.
function isArchivedApplication(a){
  return a.result === 'fail';
}

// True when this person's application passed review, but they later failed
// their 1st Demo — their application.result correctly stays 'pass' (the
// application itself was fine, they just didn't perform in the demo), so
// this is checked separately from isArchivedApplication rather than folded
// into it. Used only to drop them off the ACTIVE Applications list (they're
// done, and already tracked in Archive → 1st Demo with a link back to this
// same application) — never changes what "Archive → Application" shows.
function hasMovedOnFromApplication(a){
  const emailNorm = (a.email||'').trim().toLowerCase();
  return bookings.some(b => (b.email||'').trim().toLowerCase() === emailNorm && b.demoResult === 'fail');
}

// Gathers every past "archived" event for this email — failed applications,
// failed demos, resignations, terminations — so admin can see at a glance
// that someone applying now is a repeat applicant and where they dropped off
// before. Excludes the current application record itself.
function getReapplicationHistory(email, excludeAppId){
  const emailNorm = (email||'').trim().toLowerCase();
  if(!emailNorm) return [];
  const events = [];
  applications.forEach(a => {
    if(a.id === excludeAppId) return;
    if((a.email||'').trim().toLowerCase() === emailNorm && isArchivedApplication(a)){
      events.push({ type: 'Application — Failed', date: a.submittedAt });
    }
  });
  bookings.forEach(b => {
    if((b.email||'').trim().toLowerCase() !== emailNorm) return;
    if(b.demoResult === 'fail'){
      events.push({ type: '1st Demo — Failed', date: b.date });
    }
    if(b.secondDemoResult === 'fail'){
      events.push({ type: '2nd Demo — Failed', date: b.secondDemoDate || b.date });
    }
    if(b.tutorEmploymentStatus === 'resigned'){
      events.push({ type: 'Tutor — Resigned', date: b.tutorEmploymentDate, note: b.tutorEmploymentNote });
    }
    if(b.tutorEmploymentStatus === 'terminated'){
      events.push({ type: 'Tutor — Terminated', date: b.tutorEmploymentDate, note: b.tutorEmploymentNote });
    }
    // Someone who came in via Tutor Sign-Up or "Add Existing Tutor" (skipping
    // the apply/demo pipeline entirely) never has a demo result to flag —
    // but if they then submit a normal application too, admin should still
    // see that this email already has a tutor account.
    if(b.existingTutor && b.tutorAccountCreated && !isFormerTutor(b)){
      events.push({ type: 'Existing Tutor — Account Already Active', date: b.submittedAt });
    }
  });
  return events.sort((x,y) => new Date(y.date||0) - new Date(x.date||0));
}

    entries.push({
      key: 'app_'+a.id, name: a.fullName, email: a.email, stage: 'Application',
      dateVal: a.submittedAt, viewAppId: a.id, chatId: matchingBooking ? matchingBooking.id : null,

  bookings.filter(b => b.demoResult === 'fail').forEach(b => {

function renderAdminDates(){
  const base = new Date();
  base.setMonth(base.getMonth()+datesMonthOffset);
  const start = new Date(base.getFullYear(), base.getMonth(), 1);
  const dates = [];
  let cur = new Date(); cur.setHours(0,0,0,0); cur.setDate(cur.getDate()+1);
  // Show 28 upcoming weekdays regardless of month paging (simpler + always relevant)
  while(dates.length < 28){
    if(isWeekday(cur)) dates.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  const cells = dates.map(d=>{
    const ds = fmtDate(d);
    const closed = isDateClosed(ds);
    const remain = dateRemainingCount(ds);
    return `
    <div class="date-btn ${closed?'closed':''}" data-toggle-date="${ds}" style="cursor:pointer;">
      <div class="dow">${DOW[d.getDay()]}</div>
      <div class="dnum">${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}</div>
      <div class="avail">${closed ? 'Closed — click to open' : remain+' left — click to close'}</div>
    </div>`;
  }).join('');
  return `
  <div class="card">
    <div class="section-title">Open / Close Dates</div>
    <div class="section-desc">Click any date to open or close it for booking. Closed dates are shown as unavailable to applicants, the same way weekends are hidden.</div>
    <div class="date-grid">${cells}</div>
  </div>`;
}

function getDefaultSchemaFor(formKey){
  if(formKey==='apply') return APPLY_FORM_DEFAULT_SCHEMA;

  return SIGNUP_FORM_DEFAULT_SCHEMA;
}

function getFormBuilderDraft(formKey){
  if(!formBuilderDraft[formKey]){
    const base = formSchemas[formKey] || getDefaultSchemaFor(formKey);

  return formBuilderDraft[formKey];
}

function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);
  // Wired once here regardless of view — harmless no-op wherever none of
  // these buttons happen to be in the DOM (the banner can show at the top
  // of the admin Chat tab group, or the tutor/applicant's own chat view).
  // Passing bk.id here (only meaningful when we're actually on that view)
  // is what lets turning notifications on ALSO subscribe this device to
  // real push for that specific conversation.
  wireChatNotificationControls(view==='book' && bk.done ? bk.id : undefined);

  const tutorProfileBtn = $('#tutorProfileBtn');
  if(tutorProfileBtn) tutorProfileBtn.onclick = () => { tutorProfileModalOpen = true; render(); };
  const tutorProfileCloseBtn = $('#tutorProfileCloseBtn');
  if(tutorProfileCloseBtn) tutorProfileCloseBtn.onclick = () => { tutorProfileModalOpen = false; render(); };
  const tutorProfileOverlay = $('#tutorProfileOverlay');
  if(tutorProfileOverlay) tutorProfileOverlay.onclick = (e) => { if(e.target.id==='tutorProfileOverlay'){ tutorProfileModalOpen = false; render(); } };

  const logoutBtn = $('#logoutBtn');
  if(logoutBtn) logoutBtn.onclick = async () => {
    stopChatPolling();
    chatStagedFile = null;
    tutorProfileModalOpen = false;
    stopApplicationsPolling();

        // createBooking in functions/index.js) — this closes the small gap
        // that used to exist between checking a slot was free and actually
        // writing to it, where two people booking at nearly the same
        // instant could theoretically both slip through. A couple of
        // retries here are still worth keeping for genuinely transient
        // network hiccups reaching the function at all, separate from that.
        const MAX_ATTEMPTS = 3;
        let attempt = 0;

        // Query the subcollection directly rather than relying on the local
        // `messages` array — that's only populated once admin has actually
        // opened this specific chat, so it could be empty even when the
        // subcollection itself has plenty of messages in it.
        const msgsSnap = await db.collection(BOOKINGS_COLLECTION).doc(id).collection(MESSAGES_SUBCOLLECTION).get();
        const fileUrls = msgsSnap.docs.map(d => d.data().fileUrl).filter(Boolean);
        await Promise.all(fileUrls.map(deleteStorageFileByUrl));
        // Firestore never auto-deletes a subcollection when its parent
        // document is deleted — each message doc has to go explicitly. A
        // batch tops out at 500 operations, and a long-running daily
        // conversation can genuinely exceed that after a few months, so
        // this chunks the deletes instead of assuming one batch is enough.
        const CHUNK_SIZE = 450;
        for(let i = 0; i < msgsSnap.docs.length; i += CHUNK_SIZE){
          const chunkBatch = db.batch();
          msgsSnap.docs.slice(i, i + CHUNK_SIZE).forEach(d => chunkBatch.delete(d.ref));
          await chunkBatch.commit();
        }
        await db.collection(BOOKINGS_COLLECTION).doc(id).delete();

        const tutorLoginLink = window.location.origin + window.location.pathname + '?tutor';
        const subject = "Your Langdy chat account is ready";
        const body = `Hi ${fullName},

We've set up an account so you can chat with us directly on the site from now on, instead of KakaoTalk.

Login link: ${tutorLoginLink}
Email: ${email}
Temporary password: ${tempPassword}

Please log in and feel free to change your password once you're in (under your account settings).

Best,
Langdy Team`;

        const candidates = addExistingTutorDraft.rows

          .filter(r => r.fullName || r.tutorName || r.email);

        const results = [];
        // Firebase caps new account creation at 100 per hour per IP address
        // (a client-side anti-abuse limit, not something we can raise without
        // a paid backend). If we hit it mid-batch, every remaining attempt
        // would fail the same way, so stop immediately instead of burning
        // through the rest of the list with the same error.
        let rateLimited = false;

          const updated = Object.assign({}, bookings[idx], { tutorEmploymentStatus: 'active', tutorEmploymentDate: null, tutorAccountDisabled: false });
          const next = [...bookings]; next[idx] = updated;
          await saveBookings(next);
          if(wasDisabled){
            try{ await setTutorAccountDisabled(bookings[idx].email, false); }catch(e){ console.error('Failed to re-enable login on reactivate:', e); }
          }
          render();
        };
      });
    }

    if(chatTarget){
      const chatInput = $('#chatInput');
      const chatSendBtn = $('#chatSendBtn');
      const chatAttachStatus = $('#chatAttachStatus');
      const doSend = async () => {
        if(!chatInput) return;
        const text = chatInput.value;
        if(!text.trim() && !chatStagedFile) return;
        chatInput.disabled = true; if(chatSendBtn) chatSendBtn.disabled = true;
        let fileInfo = null;
        if(chatStagedFile){
          if(chatAttachStatus) chatAttachStatus.textContent = 'Uploading file…';
          try{
            const url = await uploadEntityFile(chatStagedFile, 'bookings', chatTarget.id, 'chat_'+Date.now());
            fileInfo = { url, name: chatStagedFile.name, type: chatStagedFile.type };
          }catch(err){
            console.error('Chat file upload error:', err);
            if(chatAttachStatus) chatAttachStatus.textContent = "Couldn't upload that file — please try again.";
            chatInput.disabled = false; if(chatSendBtn) chatSendBtn.disabled = false;
            return;
          }
        }
        await sendChatMessage(chatTarget.id, 'admin', text, fileInfo);
        // Don't manually touch chatTarget/bookings here — the real-time
        // listener already watching this booking reflects the send moments
        // after it lands, via its own onTick callback below.
        chatStagedFile = null;
        chatDraftText = '';
        if(chatAttachStatus) chatAttachStatus.textContent = '';
        chatInput.disabled = false; if(chatSendBtn) chatSendBtn.disabled = false;
        render();
        const thread = document.getElementById('chatThread');
        if(thread) thread.scrollTop = thread.scrollHeight;
        const freshInput = document.getElementById('chatInput');
        if(freshInput) freshInput.focus();
      };
      if(chatSendBtn) chatSendBtn.onclick = doSend;
      if(chatInput){
        chatInput.oninput = e => { chatDraftText = e.target.value; };
        chatInput.addEventListener('keydown', e => { if(e.key==='Enter' && !e.isComposing) doSend(); });
        wireChatComposition(chatInput);
      }
      const thread = document.getElementById('chatThread');
      if(thread) thread.scrollTop = thread.scrollHeight;
      const chatAttachBtn = $('#chatAttachBtn');
      const chatFileInput = $('#chatFileInput');
      if(chatAttachBtn && chatFileInput) chatAttachBtn.onclick = () => chatFileInput.click();
      if(chatFileInput) chatFileInput.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        chatStagedFile = file;
        chatFileInput.value = '';
        render();
        const freshInput = document.getElementById('chatInput');
        if(freshInput) freshInput.focus();
      };
      const chatStagedFileRemoveBtn = $('#chatStagedFileRemoveBtn');
      if(chatStagedFileRemoveBtn) chatStagedFileRemoveBtn.onclick = () => { chatStagedFile = null; render(); };
      $$('[data-delete-msg]').forEach(el=>{
        el.onclick = async () => {
          const bookingId = el.dataset.deleteMsg;
          const msgId = el.dataset.msgId;
          if(!msgId) return;
          if(!confirm('Delete this message? This cannot be undone.')) return;
          const idx = bookings.findIndex(x=>x.id===bookingId);
          if(idx === -1) return;
          const msgs = bookings[idx].messages || [];
          const deletedMsg = msgs.find(m => m.id === msgId);
          if(!deletedMsg) return;
          if(deletedMsg.fileUrl) await deleteStorageFileByUrl(deletedMsg.fileUrl);
          await db.collection(BOOKINGS_COLLECTION).doc(bookingId).collection(MESSAGES_SUBCOLLECTION).doc(msgId).delete();
          // If the deleted message was the most recent one, the list
          // preview needs to fall back to whatever's now last (or go blank
          // if that was the only message) — otherwise it'd keep showing a
          // message that no longer exists until the next new one arrives.
          const remaining = msgs.filter(m => m.id !== msgId);
          const newLast = remaining.length > 0 ? remaining[remaining.length - 1] : null;
          await db.collection(BOOKINGS_COLLECTION).doc(bookingId).update({
            lastMessageText: newLast ? (newLast.text || (newLast.fileUrl ? '📎 Sent a file' : '')) : '',
            lastMessageAt: newLast ? newLast.at : null,
            lastMessageFrom: newLast ? newLast.from : null
          });
          // The subcollection listener will pick up the deletion and refresh
          // the local messages array on its own — no manual update needed.
          render();
        };
      });
      $('#chatModalCloseBtn').onclick = () => { stopChatPolling(); chatDraftText=''; chatStagedFile=null; chatTarget=null; chatAdminReadCutoffAtOpen=null; render(); };
      $('#chatModalOverlay').onclick = (e) => { if(e.target.id==='chatModalOverlay'){ stopChatPolling(); chatDraftText=''; chatStagedFile=null; chatTarget=null; chatAdminReadCutoffAtOpen=null; render(); } };
      startChatPolling(chatTarget.id, async () => {
        if(chatTarget){
          const fresh = bookings.find(b=>b.id===chatTarget.id);
          if(fresh) chatTarget = fresh;
          if(unreadCountForAdmin(chatTarget) > 0) await markChatReadByAdmin(chatTarget.id);
          renderPreservingChatScrollUnlessComposing();
        }
      });
    } else {
      // Only stop polling here if nothing else on the admin side needs it —
      // the applicant chat view manages its own start/stop independently.
      if(chatPollBookingId && adminTab==='list') stopChatPolling();
    }

    if(editingSecondDemo){
      const saveField = async (patch) => {
        await loadBookings();
        const idx = bookings.findIndex(x=>x.id===editingSecondDemo.id);
        if(idx===-1) return;
        const updated = Object.assign({}, bookings[idx], patch);
        const next = [...bookings]; next[idx] = updated;
        await saveBookings(next);
        editingSecondDemo = updated;
        render();
      };
      const assignSel = $('#esdAssign');
      if(assignSel) assignSel.onchange = () => saveField({ secondDemoAssignedTo: assignSel.value });
      const dateSel = $('#esdDate');
      if(dateSel) dateSel.onchange = () => saveField({ secondDemoDate: dateSel.value });
      const resultSel = $('#esdResult');
      if(resultSel) resultSel.onchange = () => saveField({ secondDemoResult: resultSel.value });
      const timeSel = $('#esdTime');
      if(timeSel) timeSel.onchange = () => saveField({ secondDemoTime: timeSel.value });
      $('#esdCloseBtn').onclick = () => { editingSecondDemo = null; render(); };
      $('#esdOverlay').onclick = (e) => { if(e.target.id==='esdOverlay'){ editingSecondDemo=null; render(); } };
      $('#esdChatBtn').onclick = async () => {
        const id = editingSecondDemo.id;
        editingSecondDemo = null;
        chatTarget = bookings.find(b=>b.id===id);
        chatAdminReadCutoffAtOpen = chatTarget ? chatTarget.lastReadByAdmin : null;
        chatDraftText = '';
        render();
        await markChatReadByAdmin(id);
        render();
      };
    }
  }
}

/* ============================================================
   Init
   ============================================================ */
// Re-checks the applicant/tutor's own chat read status whenever the tab
// regains focus or becomes visible again — not just when a NEW Firestore
// change happens to arrive. Without this, someone who opens the chat,
// switches away, and comes back to READ an already-unread message (with no
// further new message triggering the Firestore listener) would never get
// marked as read, since the listener's callback only re-runs on actual
// data changes, not on focus changes.
async function checkAndMarkApplicantChatRead(){
  if(view !== 'book' || !bk.done || !bk.id) return;
  const fresh = bookings.find(b => b.id === bk.id);
  if(!fresh) return;
  const tabActivelyFocused = document.visibilityState === 'visible' && document.hasFocus();
  if(tabActivelyFocused && unreadCountForApplicant(fresh) > 0){
    await markChatReadByApplicant(bk.id);
    render();
  }
}
window.addEventListener('focus', checkAndMarkApplicantChatRead);
document.addEventListener('visibilitychange', checkAndMarkApplicantChatRead);

(async function init(){
  const params = new URLSearchParams(window.location.search);
  if(params.has('apply')) view = 'apply';
  else if(params.has('signup')) view = 'signupForm';
  else if(params.has('device')) view = 'deviceForm';
  else if(params.has('admin')){
    gateMode = 'adminLogin'; cameFromAdminLink = true;
    const requestedTab = params.get('tab');
    if(requestedTab && isValidAdminTabKey(requestedTab)) adminTab = requestedTab;
  }
  else if(params.has('tutor')){ gateMode = 'tutorLogin'; cameFromTutorLink = true; }
  await Promise.all([loadConfig(), loadBookings(), loadFormSchemas(), loadFormImages()]);

  // If this browser has a remembered still-applicant booking (from a
  // previous visit), skip straight back to their chat instead of showing
  // the access-code screen — same convenience "Find your chat" already
  // gave them, just without needing to retype the email every time. Only
  // applies on a plain visit — explicitly excludes ?admin/?tutor too, not
  // just checking view==='gate', since those links only change gateMode
  // (not view), so the view check alone never actually caught them.
  if(view === 'gate' && !cameFromAdminLink && !cameFromTutorLink){
    const rememberedId = getRememberedBookingId();
    if(rememberedId){
      try{
        const doc = await db.collection(BOOKINGS_COLLECTION).doc(rememberedId).get();
        if(doc.exists){
          const data = Object.assign({ id: doc.id }, doc.data());
          if(data.tutorAccountCreated === true){
            // They've since become a tutor — this shortcut no longer
            // applies to them (tutor-stage bookings require real sign-in),
            // so clear it and let them use Tutor Sign In properly instead.
            forgetMyBooking();
          } else {
            bookings.push(data);
            bk = { step:3, date:data.date, time:data.time, fullName:data.fullName, email:data.email,
                   agree1:true, agree2:true, error:'', busy:false, done:true, weekOffset:0, id: data.id };
            view = 'book';
            checkAndMarkApplicantChatRead();
          }
        } else {
          forgetMyBooking(); // booking no longer exists (cancelled/deleted) — nothing to restore
        }
      }catch(e){
        console.error('Failed to restore remembered booking:', e);
      }
    }
  }

  // Admin and tutor now each get their own Firebase Auth instance (see
  // adminAuth above), so their sign-in states can't interfere with each
  // other — signing into one no longer bounces the other back to its login
  // screen. Each listener persists across reloads independently and is
  // wrapped in try/catch so a failure in one doesn't blank the whole page.
  try{
    let adminAuthInitialCheckDone = false;
    adminAuth.onAuthStateChanged(async (user) => {
      const isInitialCheck = !adminAuthInitialCheckDone;
      adminAuthInitialCheckDone = true;

      if(!cameFromAdminLink && view !== 'admin'){
        // Don't let a persisted admin session (from this same browser,
        // unrelated to this pageview) leak into currentAdminUser — e.g. on
        // a ?tutor page, this would make the topbar's Log Out button think
        // an admin session is active and sign that out instead of the
        // tutor's own session.
        render();
        return;
      }

      const isRealAdmin = !!user && isAllowedAdminEmail(user.email);
      currentAdminUser = isRealAdmin ? user : null;

      if(user && !isRealAdmin && cameFromAdminLink){
        // They successfully authenticated with Firebase, but this email
        // isn't on the admin allowlist. Authentication succeeding is NOT
        // the same as being authorized, so never grant admin access here;
        // sign them back out immediately.
        adminLoginBusy = false;
        adminLoginError = "This account doesn't have admin access.";
        gateMode = 'adminLogin';
        adminAuth.signOut();
        render();
        return;
      }

      if(isRealAdmin){
        adminLoginBusy = false; adminLoginError = '';
        if(cameFromAdminLink) gateMode = 'code';
        // Only auto-jump to the admin dashboard when this pageview came in
        // through the dedicated ?admin link (or we're already there this
        // session). Visiting the plain shared link should always show the
        // ordinary access-code screen, even if an admin session happens to
        // be persisted in this browser — the two are meant to stay separate.
        const shouldEnterAdmin = cameFromAdminLink || view === 'admin';
        if(shouldEnterAdmin && view !== 'apply' && view !== 'signupForm' && view !== 'deviceForm'){
          try{
            await loadAllAdminData();
          }catch(e){
            console.error('Failed to load admin data after sign-in:', e);
          }
          view = 'admin';
          syncAdminTabUrl();
        }
      } else {
        adminLoginBusy = false;
        // (Don't blindly clear adminLoginError here — if it was just set by
        // the not-an-admin rejection above, this callback fires again right
        // after that forced signOut(), and clearing it would wipe the
        // message before the person ever sees it.)
        // Only touch gateMode when we're actually in an admin-link context —
        // this listener runs on every page (tutor pages included), and
        // blindly resetting to 'code' here would stomp on whatever the
        // tutor listener just set up on a ?tutor page.
        if(!isInitialCheck && cameFromAdminLink) gateMode = 'adminLogin';
        if(view === 'admin') view = 'gate';
      }
      render();
    });
  }catch(e){
    console.error('Admin Auth failed to initialize:', e);
  }

  try{
    let tutorAuthInitialCheckDone = false;
    firebase.auth().onAuthStateChanged(async (user) => {
      const isInitialCheck = !tutorAuthInitialCheckDone;
      tutorAuthInitialCheckDone = true;

      if(!cameFromTutorLink){
        // Don't let a persisted tutor session (from this same browser,
        // unrelated to this pageview) leak into a regular tester's booking
        // flow — currentTutorUser must stay null here so renderBookDone()
        // shows the normal ticket UI, not the tutor chat UI. Reaching tutor
        // sign-in no longer requires a separate ?tutor URL/reinstall either
        // way — see the "Already a tutor?" link on the default gate screen,
        // which flips gateMode client-side without navigating at all.
        render();
        return;
      }
      currentTutorUser = user;

      if(user){
        tutorLoginBusy = false;
        if(view !== 'apply' && view !== 'signupForm' && view !== 'deviceForm'){
          const match = await findBookingByEmail(user.email||'');
          if(match && match.tutorAccountCreated === true){
            tutorLoginError = '';
            bk = { step:3, date:match.date, time:match.time, fullName:match.fullName, email:match.email,
                   agree1:true, agree2:true, error:'', busy:false, done:true, weekOffset:0, id: match.id };
            view = 'book';
            if(!bookings.some(b => b.id === match.id)) bookings.push(match);
            checkAndMarkApplicantChatRead();
          } else {
            tutorLoginError = "Signed in, but couldn't find a booking under this email. Please contact the admin.";
            gateMode = 'tutorLogin';
            view = 'gate';
            firebase.auth().signOut(); // no matching booking — don't stay signed in with nowhere to go
          }
        }
      } else {
        tutorLoginBusy = false;
        if(!isInitialCheck && !tutorLoginError) gateMode = 'tutorLogin';
        if(view === 'book') view = 'gate';
      }
      render();
    });
  }catch(e){
    console.error('Tutor Auth failed to initialize:', e);
  }

  render();
})();

// Lets the browser's back/forward buttons step through admin tab history
// (each tab click pushed its own entry via syncAdminTabUrl) — only acts
// when actually viewing the admin panel, so it doesn't interfere with
// back/forward on the applicant/tutor side of the app.
window.addEventListener('popstate', () => {
  if(view !== 'admin') return;
  const params = new URLSearchParams(window.location.search);
  const tab = params.get('tab');
  if(tab && isValidAdminTabKey(tab)){
    adminTab = tab;
    adminSidebarOpen = false;
    render();
  }
});
</script>
